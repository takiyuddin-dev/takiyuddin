<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imam Nawawi's 40 Hadith Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --tr-color: #10b981;
            --en-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 64, 175, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 2rem;
            line-height: 1.6;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.6rem 1rem;
            border-radius: 99px;
            color: white;
            font-size: 0.9rem;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
            width: 300px;
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 99px;
            border: 1px solid var(--glass-border);
        }

        .toggle-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            color: var(--text-secondary);
        }

        .toggle-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
        }
        
        .toggle-btn.active.tr { background: var(--tr-color); }
        .toggle-btn.active.en { background: var(--en-color); }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            gap: 1.5rem;
        }

        .hadith-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease forwards;
        }

        .hadith-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .hadith-id {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            opacity: 0.8;
        }

        .hadith-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            text-align: center;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: right;
            margin: 2rem 0;
            color: #fde047;
            line-height: 2;
            direction: rtl;
            padding: 1.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .translation {
            font-size: 1.15rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: var(--text-primary);
            text-align: justify;
        }

        .source {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .search-box input { width: 100%; }
            .search-box input:focus { width: 100%; }
            .arabic { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>40 Hadith Explorer</h1>
        </div>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search narrations or titles...">
            </div>
            <div class="toggle-group">
                <button class="toggle-btn active tr" onclick="setLang('tr')" id="btn-tr">TR</button>
                <button class="toggle-btn en" onclick="setLang('en')" id="btn-en">EN</button>
                <button class="toggle-btn" onclick="setLang('ar')" id="btn-ar">AR</button>
            </div>
        </div>
    </header>

    <div class="container" id="hadithContainer">
        <!-- Cards injected by JS -->
    </div>

    <script>
        const hadiths = [{"id": 1, "title_tr": "AMELLER NİYETLERE GÖREDİR", "title_en": "Actions are by Intentions", "title_ar": "الحديث الأول", "hadith_tr": "Mü’minlerin emiri Ömer bin Hattab’tan (radiyallahu anh) rivayet olunur ki o (radiyallahu anh) şöyle der: Resulullah’ı (sallallahu aleyhi ve sellem) şöyle söylerken duydum: “Ameller niyetlere göredir. Bir kimse için ancak niyet ettiği şey vardır. Kimin hicreti, Allah’a (celle celaluhu) ve Resulü’ne (sallallahu aleyhi ve sellem) ise onun hicreti, Allah’a ve Resulü’nedir. Elde edeceği bir dünyalık veya nikahlayacağı bir kadından dolayı hicret edenin hicreti ise, hicretine sebep olan şeyedir.”", "hadith_en": "It is narrated on the authority of Amirul Mu'minin, Abu Hafs 'Umar bin al-Khattab (ra) who said: I heard the Messenger of Allah (ﷺ) say: \"Actions are (judged) by motives (niyyah), so each man will have what he intended. Thus, he whose migration (hijrah) was to Allah and His Messenger, his migration is to Allah and His Messenger; but he whose migration was for some worldly thing he might gain, or for a wife he might marry, his migration is to that for which he migrated.\" [Bukhari & Muslim]", "hadith_ar": "عَنْ أَمِيرِ الْمُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: \" إنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوْ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إلَى مَا هَاجَرَ إلَيْهِ\". رَوَاهُ إِمَامَا الْمُحَدِّثِينَ أَبُو عَبْدِ اللهِ مُحَمَّدُ بنُ إِسْمَاعِيل بن إِبْرَاهِيم بن الْمُغِيرَة بن بَرْدِزبَه الْبُخَارِيُّ الْجُعْفِيُّ [رقم:1]، وَأَبُو الْحُسَيْنِ مُسْلِمٌ بنُ الْحَجَّاج بن مُسْلِم الْقُشَيْرِيُّ النَّيْسَابُورِيُّ [رقم:1907] رَضِيَ اللهُ عَنْهُمَا فِي \"صَحِيحَيْهِمَا\" اللذَينِ هُمَا أَصَحُّ الْكُتُبِ الْمُصَنَّفَةِ", "source_tr": "Buhari, Müslim, Ebu Davud, Tirmizi, İbn Mace, Nesai, Darakutni, İbn Hıbban ve Beyhaki", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 2, "title_tr": "İSLAM, İMAN VE İHSAN", "title_en": "Islam, Iman, Ihsan", "title_ar": "الحديث الثاني", "hadith_tr": "Ömer’den (radiyallahu anh) şöyle rivayet edilmiştir: Biz bir gün Resulullah’ın (sallallahu aleyhi ve sellem) yanında otururken, birden, elbisesi bembeyaz, saçları simsiyah bir adam çıkageldi. Üzerinde yolculuk yaptığını gösteren herhangi bir belirti olmadığı gibi aramızda da onu tanıyan birisi yoktu. Adam, Peygamber’in (sallallahu aleyhi ve sellem) yanına kadar gelip oturdu; dizlerini onun dizlerine dayadı; ellerini dizlerinin üzerine koydu ve şöyle dedi: - Ya Muhammed! (sallallahu aleyhi ve sellem) Bana İslam’ın ne demek olduğunu söyle? Resulullah (sallallahu aleyhi ve sellem) şu cevabı verdi: - İslam, Allah’tan başka ilah olmadığına, Muhammed’in de Allah’ın Resulü olduğuna şehadet etmen, namaz kılman, zekât vermen, Ramazan orucunu tutman ve gücün yeterse haccetmendir. Adam, doğru söyledin, dedi. Biz onun, hem sormasına hem de tasdik etmesine şaşırdık. Adam sonra: - Şimdi de bana imanın ne demek olduğunu söyle, dedi. Peygamber (sallallahu aleyhi ve sellem): Allah’a, meleklerine, kitaplarına, peygamberlerine, ahiret gününe, kadere, hayır ve şerrin O’ndan olduğuna inanmandır, buyurdu. Adam yine: - Doğru söyledin, dedi. Arkasından: -Bana ihsanı anlat, dedi. Rasululah (sallallahu aleyhi ve sellem): - İhsan, görüyormuş gibi Allah’a ibadet etmendir. Her ne kadar sen onu görmüyorsan da o, muhakkak seni görmektedir, cevabını verdi. Adam: - Bana, kıyametin ne zaman kopacağını söyle, dedi. Peygamber (sallallahu aleyhi ve sellem): -Sorulan, (bu konuda) sorandan daha bilgili değildir (senin gibi ben de bilmiyorum), dedi. O: - Öyleyse bana kıyametin alametlerinden söz et, dedi. Resulullah (sallallahu aleyhi ve sellem): - Cariyenin hanımefendisini doğurması ve yalınayak, çıplak, fakir deve çobanlarını yaptırdıkları binalarla boy ölçüşürken görmendir, dedi. Hz. Ömer (radiyallahu anh) sözüne şöyle devam etti: Daha sonra adam çıkıp gitti. Bir süre hayretler içinde kaldım. Sonra Resulullah (sallallahu aleyhi ve sellem): Ömer! Soru soran kimdi, biliyor musun? dedi. Ben de: - Allah ve Resulü daha iyi bilir, dedim. Peygamber (sallallahu aleyhi ve sellem): - O Cebrail’di. Size dininizi öğretmeye gelmişti, buyurdu.”", "hadith_en": "Also on the authority of `Umar (ra) who said: While we were one day sitting with the Messenger of Allah (ﷺ) there appeared before us a man dressed in extremely white clothes and with very black hair. No traces of journeying were visible on him, and none of us knew him. He sat down close by the Prophet (ﷺ) rested his knees against the knees of the Prophet (ﷺ) and placed his palms over his thighs, and said: \"O Muhammad! Inform me about Islam.\" The Messenger of Allah (ﷺ) replied: \"Islam is that you should testify that there is no deity worthy of worship except Allah and that Muhammad is His Messenger (ﷺ), that you should perform salah (ritual prayer), pay the zakah, fast during Ramadan, and perform Hajj (pilgrimage) to the House (the Ka`bah at Makkah), if you can find a way to it (or find the means for making the journey to it).\" He said: \"You have spoken the truth.\" We were astonished at his thus questioning him (ﷺ) and then telling him that he was right, but he went on to say, \"Inform me about Iman (faith).\" He (the Prophet) answered, \"It is that you believe in Allah and His angels and His Books and His Messengers and in the Last Day, and in fate (qadar), both in its good and in its evil aspects.\" He said, \"You have spoken the truth.\" Then he (the man) said, \"Inform me about Ihsan.\" He (the Prophet) answered, \"It is that you should serve Allah as though you could see Him, for though you cannot see Him yet He sees you.\" He said, \"Inform me about the Hour.\" He (the Prophet) said, \"About that the one questioned knows no more than the questioner.\" So he said, \"Well, inform me about its signs.\" He said, \"They are that the slave-girl will give birth to her mistress and that you will see the barefooted ones, the naked, the destitute, the herdsmen of the sheep (competing with each other) in raising lofty buildings.\" Thereupon the man went off. I waited a while, and then he (the Prophet) said, \"O `Umar, do you know who that questioner was?\" I replied, \"Allah and His Messenger know better.\" He said, \"That was Jibril. He came to teach you your religion.\" [Muslim]", "hadith_ar": "عَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ أَيْضًا قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللَّهِ صلى الله عليه و سلم ذَاتَ يَوْمٍ، إذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعْرِ، لَا يُرَى عَلَيْهِ أَثَرُ السَّفَرِ، وَلَا يَعْرِفُهُ مِنَّا أَحَدٌ. حَتَّى جَلَسَ إلَى النَّبِيِّ صلى الله عليه و سلم . فَأَسْنَدَ رُكْبَتَيْهِ إلَى رُكْبَتَيْهِ، وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ، وَقَالَ: يَا مُحَمَّدُ أَخْبِرْنِي عَنْ الْإِسْلَامِ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إلَهَ إلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إنْ اسْتَطَعْت إلَيْهِ سَبِيلًا. قَالَ: صَدَقْت . فَعَجِبْنَا لَهُ يَسْأَلُهُ وَيُصَدِّقُهُ! قَالَ: فَأَخْبِرْنِي عَنْ الْإِيمَانِ. قَالَ: أَنْ تُؤْمِنَ بِاَللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ، وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ. قَالَ: صَدَقْت. قَالَ: فَأَخْبِرْنِي عَنْ الْإِحْسَانِ. قَالَ: أَنْ تَعْبُدَ اللَّهَ كَأَنَّك تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاك. قَالَ: فَأَخْبِرْنِي عَنْ السَّاعَةِ. قَالَ: مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنْ السَّائِلِ. قَالَ: فَأَخْبِرْنِي عَنْ أَمَارَاتِهَا؟ قَالَ: أَنْ تَلِدَ الْأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ. ثُمَّ انْطَلَقَ، فَلَبِثْتُ مَلِيًّا، ثُمَّ قَالَ: يَا عُمَرُ أَتَدْرِي مَنْ السَّائِلُ؟. ‫‬قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim, Tirmizi, Ebu Davud ve Nesai", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 3, "title_tr": "İSLAM’IN TEMEL ESASLARI", "title_en": "Pillars of Islam", "title_ar": "الحديث الثالث", "hadith_tr": "Ebu Abdurrahman Abdullah bin Ömer’den (radiyallahu anh), o, şöyle der: Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu duydum: İslam dini beş temel esas üzerine bina edilmiştir: Allah’tan (celle celaluhu) başka ilah olmadığına ve Muhammed’in Allah’ın (celle celaluhu) Resulü olduğuna şehadet etmek, namaz kılmak, zekât vermek, Kâbe’yi tavaf etmek (hacca gitmek), Ramazan orucunu tutmak.”", "hadith_en": "On the authority of Abdullah, the son of Umar ibn al-Khattab (ra), who said: I heard the Messenger of Allah (ﷺ) say, \"Islam has been built on five [pillars]: testifying that there is no deity worthy of worship except Allah and that Muhammad is the Messenger of Allah, establishing the salah (prayer), paying the zakat (obligatory charity), making the hajj (pilgrimage) to the House, and fasting in Ramadhan.\" [Bukhari & Muslim]", "hadith_ar": "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللَّهِ بْنِ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إلَهَ إلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ . [رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari, Müslim, Tirmizi, Nesai ve Ahmed b. Hanbel", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 4, "title_tr": "İNSANIN YARATILIŞINDAKİ DEVRELER VE SONU", "title_en": "Creation of Humans", "title_ar": "الحديث الرابع", "hadith_tr": "Ebu Abdurrahman Abdullah bin Mes’ud’dan (radiyallahu anh): - Doğru olan ve doğruluğu Allah tarafından tasdik edilen Resulullah (sallallahu aleyhi ve sellem) bize şöyle anlattı: - Her birinizin yaratılışı, anasının karnında şöyle olur: Kırk gün nutfe olarak kalır. İkinci kırk günde alaka (kan pıhtısı) halini alır. Üçüncü kırk günde et parçası haline gelir. Bunlardan sonra, görevli melek gönderilir ve o, bu et parçasına ruh üfler. Ona dört kelimeyi; rızkını, ecelini, amelini, şaki mi (fena hareketli, bahtsız) yoksa said (iyi hareketli, bahtlı) mi olacağını yazması emredilir. Kendinden başka ilah olmayan Allah’a yemin ederim ki, sizden biri cennetliklerin amelini işler, o kadar ki cennetle kendi arasında bir arşınlık mesafe kalır. Ancak hakkındaki yazı (kader) üstün gelir, (dönüp) cehennemliklerin amelini işlemeye başlar ve sonunda cehenneme girer. Yine sizden birisi, cehennemliklerin amelini yapa yapa, cehennemle kendisi arasında bir arşın mesafe kalacak hale gelir. Fakat hakkındaki yazı ona üstün gelir, cennetliklerin amellerini işlemeye başlar ve sonunda cennete girer.", "hadith_en": "On the authority of Abdullah ibn Masood (ra), who said: The Messenger of Allah (ﷺ), and he is the truthful, the believed, narrated to us, “Verily the creation of each one of you is brought together in his mother’s womb for forty days in the form of a nutfah (a drop), then he becomes an alaqah (clot of blood) for a like period, then a mudghah (morsel of flesh) for a like period, then there is sent to him the angel who blows his soul into him and who is commanded with four matters: to write down his rizq (sustenance), his life span, his actions, and whether he will be happy or unhappy (i.e., whether or not he will enter Paradise). By the One, other than Whom there is no deity, verily one of you performs the actions of the people of Paradise until there is but an arms length between him and it, and that which has been written overtakes him, and so he acts with the actions of the people of the Hellfire and thus enters it; and verily one of you performs the actions of the people of the Hellfire, until there is but an arms length between him and it, and that which has been written overtakes him and so he acts with the actions of the people of Paradise and thus he enters it.” [Bukhari & Muslim]", "hadith_ar": "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: حَدَّثَنَا رَسُولُ اللَّهِ صلى الله عليه و سلم -وَهُوَ الصَّادِقُ الْمَصْدُوقُ-: إنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إلَيْهِ الْمَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ، وَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ: بِكَتْبِ رِزْقِهِ، وَأَجَلِهِ، وَعَمَلِهِ، وَشَقِيٍّ أَمْ سَعِيدٍ؛ فَوَاَللَّهِ الَّذِي لَا إلَهَ غَيْرُهُ إنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إلَّا ذِرَاعٌ فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ فَيَدْخُلُهَا. وَإِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إلَّا ذِرَاعٌ فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ فَيَدْخُلُهَا . [رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari, Müslim, Ebu Davud, Tirmizi ve İbni Mace", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 5, "title_tr": "MÜNKER VE BİD’ATLARIN KABUL EDİLMEMESİ", "title_en": "Rejection of Innovations", "title_ar": "الحديث الخامس", "hadith_tr": "Mü’minlerin annesi, ümmü Abdillah Aişe’den (radiyallahu anh): Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Kim bizim bu dinimizde bulunmayan bir şey ortaya çıkarırsa, o merduttur (geri çevrilmiştir).”", "hadith_en": "On the authority of the mother of the faithful, Aisha (ra), who said: The Messenger of Allah (ﷺ) said, “He who innovates something in this matter of ours (i.e., Islam) that is not of it will have it rejected (by Allah).” [Bukhari & Muslim] In another version in Muslim it reads: “He who does an act which we have not commanded, will have it rejected (by Allah).”", "hadith_ar": "عَنْ أُمِّ الْمُؤْمِنِينَ أُمِّ عَبْدِ اللَّهِ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا، قَالَتْ: قَالَ: رَسُولُ اللَّهِ صلى الله عليه و سلم مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ [رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ] وَفِي رِوَايَةٍ لِمُسْلِمٍ: مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ", "source_tr": "Müslim’e ait bir rivayette şöyle buyrulmaktadır: “Kim bu dinimize uygun olmayan bir amel yaparsa, o ameli merduttur, kabul olunmaz.”2  Buhari ve Müslim 2\t Buhari, Müslim, Ebu Davud ve İbn Mace", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 6, "title_tr": "HELAL VE HARAM", "title_en": "The Halal and Haram", "title_ar": "الحديث السادس", "hadith_tr": "Ebu Abdillah bin en-Nu’man bin Beşir ‘den(radiyallahu anh), Resulullah’ın (sallallahu aleyhi ve sellem) şöyle dediğini duydum: “Helal olan bellidir, haram da bellidir. İkisi arasında helale de harama da benzeyen ve insanların çoğunun hükmünü bilmediği şeyler vardır. Kim bu şüpheli olanlardan sakınırsa dinini ve namusunu korumuş olur. Kim de şüphelilere dalarsa sonunda harama dalar. (Bunun durumu) Koruluğun etrafında sürüsünü otlatan çoban gibidir ki koruluğa dalması pek uzak değildir. Dikkat edin! Her sultanın bir koruluğu vardır. Allah’ın (celle celaluhu) koruluğu ise haram kıldıklarıdır. Dikkat edin! Vücutta bir et parçası vardır ki o iyi olduğunda, vücudun tamamı iyi olur. O bozulduğu zaman vücudun tamamı bozulur. Haberiniz olsun! O kalptir.”", "hadith_en": "On the authority of an-Nu’man ibn Basheer (ra), who said: I heard the Messenger of Allah (ﷺ) say, “That which is lawful is clear and that which is unlawful is clear, and between the two of them are doubtful matters about which many people do not know. Thus he who avoids doubtful matters clears himself in regard to his religion and his honor, but he who falls into doubtful matters [eventually] falls into that which is unlawful, like the shepherd who pastures around a sanctuary, all but grazing therein. Truly every king has a sanctuary, and truly Allah’s sanctuary is His prohibitions. Truly in the body there is a morsel of flesh, which, if it be whole, all the body is whole, and which, if it is diseased, all of [the body] is diseased. Truly, it is the heart.” [Bukhari & Muslim]", "hadith_ar": "عَنْ أَبِي عَبْدِ اللَّهِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: إنَّ الْحَلَالَ بَيِّنٌ، وَإِنَّ الْحَرَامَ بَيِّنٌ، وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنْ النَّاسِ، فَمَنْ اتَّقَى الشُّبُهَاتِ فَقْد اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِي الشُّبُهَاتِ وَقَعَ فِي الْحَرَامِ، كَالرَّاعِي يَرْعَى حَوْلَ الْحِمَى يُوشِكُ أَنْ يَرْتَعَ فِيهِ، أَلَا وَإِنَّ لِكُلِّ مَلِكٍ حِمًى، أَلَا وَإِنَّ حِمَى اللَّهِ مَحَارِمُهُ، أَلَا وَإِنَّ فِي الْجَسَدِ مُضْغَةً إذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ، وَإذَا فَسَدَتْ فَسَدَ الْجَسَدُ كُلُّهُ، أَلَا وَهِيَ الْقَلْبُ .<br>[رَوَاهُ الْبُخَارِيُّ]، [وَمُسْلِمٌ]", "source_tr": "Buhari, Müslim, Ebu Davud, Tirmizi, Nesai ve İbn Mace", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 7, "title_tr": "DİN NASİHATTIR", "title_en": "Religion is Sincerity", "title_ar": "الحديث السابع", "hadith_tr": "Ebu Rukayye Temim bin Evs ed-Dari’den (radiyallahu anh): “Peygamber (sallallahu aleyhi ve sellem): “Din nasihattir.” buyurdu. Biz de: “Kimin için dedik.” O (sallallahu aleyhi ve sellem) “Allah için, kitabı hakkında, Peygamber’i hakkında, Müslümanların idarecileri hakkında ve diğer Müslümanlar hakkında nasihattir.” cevabını verdi.", "hadith_en": "On the authority of Tameem ibn Aus ad-Daree (ra): The Prophet (ﷺ) said, “The deen (religion) is naseehah (advice, sincerity).” We said, “To whom?” He (ﷺ) said, “To Allah, His Book, His Messenger, and to the leaders of the Muslims and their common folk.” [Muslim]", "hadith_ar": "عَنْ أَبِي رُقَيَّةَ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: \"الدِّينُ النَّصِيحَةُ.\" قُلْنَا: لِمَنْ؟ قَالَ: \"لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ.\" [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim, Ebu Davud ve Nesai", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 8, "title_tr": "MÜSLÜMAN’IN KANININ VE MALININ HARAMLIĞI", "title_en": "Sanctity of a Muslim", "title_ar": "الحديث الثامن", "hadith_tr": "Abdullah bin Ömer’ den (radiyallahu anh): Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “La ilahe illallah, Muhammedun Resulullah” demelerini sağlayıncaya, namaz kılıncaya ve zekat verinceye kadar insanlarla savaşmakla emrolundum. Bunu yaparlarsa, İslam'ın hakkı olan hükümler dışında, kanlarını ve mallarını benden korumuş olurlar. (İç) hesapları ise Allah’a aittir.”", "hadith_en": "On the authority of Abdullah ibn Umar (ra): The Messenger of Allah (ﷺ) said, \"I have been ordered to fight against the people until they testify that there is none worthy of worship except Allah and that Muhammad is the Messenger of Allah, and until they establish the salah and pay the zakat. And if they do that then they will have gained protection from me for their lives and property, unless [they commit acts that are punishable] in Islam, and their reckoning will be with Allah.\" [Bukhari & Muslim]", "hadith_ar": "عَنْ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا، أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إلَهَ إلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ؛ فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إلَّا بِحَقِّ الْإِسْلَامِ، وَحِسَابُهُمْ عَلَى اللَّهِ تَعَالَى .<br>[رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 9, "title_tr": "KOLAYLIK GÖSTERMEK, ZORLUK ÇIKARMAMAK, İTAAT EDİP İNATÇILIĞI BIRAKMAK KURTULUŞ YOLUDUR", "title_en": "Obligations are According to Ability", "title_ar": "الحديث التاسع", "hadith_tr": "Ebu Hureyre Abdurrahman bin Sahr (radiyallahu anh)'dan: “Resulullah (sallallahu aleyhi ve sellem)'ın şöyle buyurduğunu duydum: “Sizi men ettiğim şeylerden sakının. Emrettiklerimi de gücünüzün yettiği oranda yerine getirin. Şüphesiz sizden öncekileri, çok soru sormaları ve peygamberlerine muhalefet etmeleri mahvetmiştir.”", "hadith_en": "On the authority of Abu Hurayrah (ra): I heard the Messenger of Allah (ﷺ) say, “What I have forbidden for you, avoid. What I have ordered you [to do], do as much of it as you can. For verily, it was only the excessive questioning and their disagreeing with their Prophets that destroyed [the nations] who were before you.” [Bukhari & Muslim]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ عَبْدِ الرَّحْمَنِ بْنِ صَخْرٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلَافُهُمْ عَلَى أَنْبِيَائِهِمْ .<br>[رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 10, "title_tr": "TEMİZ VE HELAL YEMEK, DUANIN KABUL ŞARTLARINDANDIR", "title_en": "Purity and Halal Provision", "title_ar": "الحديث العاشر", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Allah (celle celaluhu) temizdir, ancak temiz olanı kabul eder. Allah (celle celaluhu) peygamberlere neyi emrettiyse, Mü’minlere de onu emretmiş ve: “Ey peygamberler! Tertemiz, helal olanlardan yiyin ve salih amel işleyin.” , “Ey iman edenler! Size verdiğimiz rızıkların tertemiz ve helal olanlardan yiyin.” Sonra Resulullah (sallallahu aleyhi ve sellem), hac için uzun uzadıya yolculuk yapan, saçları dağınık, toz toprak içinde kalan bir adamı anlatarak şöyle buyurdu: “Bu adam ellerini semaya kaldırıp: Ya Rabbi! Ya Rabbi! diye yalvarır. Hâlbuki o adamın yediği haramdır. Vücudu haram gıdalarla beslenmiştir. Bunun duası nasıl kabul edilir?” 1 Mu'minun, 51. 2 Bakara, 172. 3 Müslim ve Tirmizi", "hadith_en": "On the authority of Abu Hurayrah (ra): The Messenger of Allah (ﷺ) said, “Allah the Almighty is Good and accepts only that which is good. And verily Allah has commanded the believers to do that which He has commanded the Messengers. So the Almighty has said: “O (you) Messengers! Eat of the tayyibat [all kinds of halal (legal) foods], and perform righteous deeds.” [23:51] and the Almighty has said: “O you who believe! Eat of the lawful things that We have provided you.” [2:172]” Then he (ﷺ) mentioned [the case] of a man who, having journeyed far, is disheveled and dusty, and who spreads out his hands to the sky saying “O Lord! O Lord!,” while his food is haram (unlawful), his drink is haram, his clothing is haram, and he has been nourished with haram, so how can [his supplication] be answered? [Muslim]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم \"إنَّ اللَّهَ طَيِّبٌ لَا يَقْبَلُ إلَّا طَيِّبًا، وَإِنَّ اللَّهَ أَمَرَ الْمُؤْمِنِينَ بِمَا أَمَرَ بِهِ الْمُرْسَلِينَ فَقَالَ تَعَالَى: \"يَا أَيُّهَا الرُّسُلُ كُلُوا مِنْ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا\"، وَقَالَ تَعَالَى: \"يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ\" ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إلَى السَّمَاءِ: يَا رَبِّ! يَا رَبِّ! وَمَطْعَمُهُ حَرَامٌ، وَمَشْرَبُهُ حَرَامٌ، وَمَلْبَسُهُ حَرَامٌ، وَغُذِّيَ بِالْحَرَامِ، فَأَنَّى يُسْتَجَابُ لَهُ؟\". [رَوَاهُ مُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 11, "title_tr": "KESİN OLANI ALIP ŞÜPHELİLERDEN UZAK DURMAK", "title_en": "Doubt vs. Certainty", "title_ar": "الحديث الحادي عشر", "hadith_tr": "Resulullah’ın (sallallahu aleyhi ve sellem) torunu ve gül kokulusu Ebu Muhammed, Hasan b. Ali (radiyallahu anh) şu hadisi rivayet etmiştir: “Sana şüpheli geleni bırakıp şüpheli olmayanı al.”", "hadith_en": "On the authority of Abu Muhammad al-Hasan ibn Ali ibn Abee Talib (may Allah be pleased with him), the grandson of the Messenger of Allah (peace and blessings of Allah be upon him), and the one much loved by him, who said: I memorised from the Messenger of Allah (peace and blessings of Allah be upon him): “Leave that which makes you doubt for that which does not make you doubt.” [At-Tirmidhi] [An-Nasai] At-Tirmidhi said that it was a good and sound (hasan saheeh) hadeeth", "hadith_ar": "عَنْ أَبِي مُحَمَّدٍ الْحَسَنِ بْنِ عَلِيِّ بْنِ أَبِي طَالِبٍ سِبْطِ رَسُولِ اللَّهِ صلى الله عليه و سلم وَرَيْحَانَتِهِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: حَفِظْت مِنْ رَسُولِ اللَّهِ صلى الله عليه و سلم دَعْ مَا يُرِيبُك إلَى مَا لَا يُرِيبُك . رَوَاهُ التِّرْمِذِيُّ [رقم:2520]، [وَالنَّسَائِيّ] وَقَالَ التِّرْمِذِيُّ: حَدِيثٌ حَسَنٌ صَحِيحٌ", "source_tr": "Tirmizi, Nesai, İmam Ahmed, Şeyh Ahmed Şakir, senedi sahihtir, demiştir", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 12, "title_tr": "FAYDALI OLANLA MEŞGUL OLMAK", "title_en": "Leaving What Does Not Concern One", "title_ar": "الحديث الثاني عشر", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, Peygamber (sallallahu aleyhi ve sellem) şöyle buyurdu: “Kendisini ilgilendirmeyen şeyleri terk etmesi, kişinin dini’nin güzelliğindendir.”", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Part of the perfection of one’s Islam is his leaving that which does not concern him.” A hasan (good) hadeeth which was related by at-Tirmidhi and others in this fashion", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم مِنْ حُسْنِ إسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ . حَدِيثٌ حَسَنٌ، رَوَاهُ التِّرْمِذِيُّ [رقم: 2318] ، ابن ماجه [رقم:]", "source_tr": "Tirmizi, İbn Mace, Ez-Zerkani Muvatt’a şerhinde isnadı hasen hatta sahih, demiştir.", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 13, "title_tr": "İMAN VE İSLAM KARDEŞLİĞİ", "title_en": "Loving for Your Brother", "title_ar": "الحديث الثالث عشر", "hadith_tr": "Resulullah’ın (sallallahu aleyhi ve sellem) hizmetçisi Ebu Hamza Enes bin Malik (radiyallahu anh) şunu rivayet etti: Resulullah (sallallahu aleyhi ve sellem) şöyle buyırdu: “Sizden birisi, kendisi için arzu ettiğini, kardeşi için de arzu etmedikçe hakkıyla iman etmiş olamaz.” 1 Buhârî, Îmân 7, Müslim, Îmân 71, Riyazus salihin H. no= 1829 ayrıca Nesai, Tirmizi ve İbn Mace", "hadith_en": "On the authority of Abu Hamzah Anas bin Malik (may Allah be pleased with him) — the servant of the Messenger of Allah (peace and blessings of Allah be upon him) — that the Prophet (peace and blessings of Allah be upon him) said: None of you [truly] believes until he loves for his brother that which he loves for himself. [Al-Bukhari] [Muslim]", "hadith_ar": "عَنْ أَبِي حَمْزَةَ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ خَادِمِ رَسُولِ اللَّهِ صلى الله عليه و سلم عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ . رَوَاهُ الْبُخَارِيُّ [رقم:13]، وَمُسْلِمٌ [رقم:45].<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 14, "title_tr": "MÜSLÜMAN’IN KANINI DÖKMEK HARAMDIR", "title_en": "Prohibition of Blood of a Muslim", "title_ar": "الحديث الرابع عشر", "hadith_tr": "Abdullah bin Mes’ud’un (radiyallahu anh) rivayetine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Allah’tan başka ilah olmadığına, benim Allah’ın Resulü olduğuma şahitlik eden Müslüman’ın kanı, ancak şu üç kişiden biri olduğunda helal olur: Zina eden evli, kasten adam öldüren ve İslam cemaatinden ayrılarak dininden dönen.”", "hadith_en": "On the authority of Ibn Masood (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “It is not permissible to spill the blood of a Muslim except in three [instances]: the married person who commits adultery, a life for a life, and the one who forsakes his religion and separates from the community.” [Al-Bukhari] [Muslim]", "hadith_ar": "عَنْ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ [ يشهد أن لا إله إلا الله، وأني رسول الله] إلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ الْمُفَارِقُ لِلْجَمَاعَةِ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari, Müslim, Ebu Davud", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 15, "title_tr": "İMANIN BAZI ÖZELLİKLERİ, GÜZEL SÖZ, MİSAFİR VE KOMŞU HAKKI", "title_en": "Islamic Manners", "title_ar": "الحديث الخامس عشر", "hadith_tr": "Ebu Hureyre’den (radiyallahu anh) rivayet edildiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Allah’a (celle celaluhu) ve ahiret gününe inanan, ya hayırlı söz söylesin ya da sussun. Allah’a (celle celaluhu) ve ahiret gününe inanan, komşusuna ikram etsin. Allah (celle celaluhu)'a ve ahiret gününe inanan misafirine ikram etsin.”", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: Let him who believes in Allah and the Last Day speak good, or keep silent; and let him who believes in Allah and the Last Day be generous to his neighbour; and let him who believes in Allah and the Last Day be generous to his guest. [Al-Bukhari] [Muslim]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: مَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 16, "title_tr": "KIZMA! SENİN İÇİN CENNET VAR!", "title_en": "Do Not Get Angry", "title_ar": "الحديث السادس عشر", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, bir adam Resulullah’a (sallallahu aleyhi ve sellem): - Bana tavsiyede bulun, dedi. Resulullah (sallallahu aleyhi ve sellem): - Öfkelenme diye cevabını verdi. Adam bu isteğini birkaç defa tekrar etti. Resulullah (sallallahu aleyhi ve sellem) yine: - Öfkelenme dedi.", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him): A man said to the Prophet (peace and blessings of Allah be upon him), “Counsel me,” so he (peace and blessings of Allah be upon him) said, “Do not become angry.” The man repeated [his request for counsel] several times, and [each time] he (peace and blessings of Allah be upon him) said, “Do not become angry.” [Al-Bukhari]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ صلى الله عليه و سلم أَوْصِنِي. قَالَ: لَا تَغْضَبْ، فَرَدَّدَ مِرَارًا، قَالَ: لَا تَغْضَبْ\" .<br>[رَوَاهُ الْبُخَارِيُّ]", "source_tr": "Buhari", "source_en": "Al-Bukhari", "source_ar": "Al-Bukhari"}, {"id": 17, "title_tr": "HER ŞEYDE İYİ OLMAK VE İYİ YAPMAK", "title_en": "Excellence in Everything", "title_ar": "الحديث السابع عشر", "hadith_tr": "Ebu Ya’la Şeddad bin Evs (radiyallahu anh) Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu rivayet etti: “Allah (celle celaluhu) her şeyde iyi olmayı ve iyi yapmayı emretmiştir. Öyle ki, öldürdüğünüzde bile iyi öldürün. Hayvanı keserken iyi kesin. Bıçağınızı iyi bileyin ve hayvanı rahatlatın, eziyet etmeyin.”", "hadith_en": "On the authority of Abu Ya’la Shaddad bin Aws (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: Verily Allah has prescribed ihsan (proficiency, perfection) in all things. So if you kill then kill well; and if you slaughter, then slaughter well. Let each one of you sharpen his blade and let him spare suffering to the animal he slaughters.” [Muslim]", "hadith_ar": "عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالَ: إنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَةَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 18, "title_tr": "TAKVA (ALLAH KORKUSU) VE GÜZEL AHLAK", "title_en": "God-Consciousness and Good Character", "title_ar": "الحديث الثامن عشر", "hadith_tr": "Ebu Zerr Cundub bin Cunade ile Ebu Abdirrahman Muaz bin Cebel (radiyallahu anh) Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu rivayet ettiler: “Nerede olursan ol, Allah’tan (celle celaluhu) kork. Kötülüğün peşinden iyilik yap ki onu silsin. İnsanlara da güzel ahlakla davran.”", "hadith_en": "On the authority of Abu Dharr Jundub ibn Junadah, and Abu Abdur-Rahman Muadh bin Jabal (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: Have taqwa (fear) of Allah wherever you may be, and follow up a bad deed with a good deed which will wipe it out, and behave well towards the people. It was related by at-Tirmidhi, who said it was a hasan (good) hadeeth, and in some copies it is stated to be a hasan saheeh hadeeth", "hadith_ar": "عَنْ أَبِي ذَرٍّ جُنْدَبِ بْنِ جُنَادَةَ، وَأَبِي عَبْدِ الرَّحْمَنِ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللَّهُ عَنْهُمَا، عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالَ: اتَّقِ اللَّهَ حَيْثُمَا كُنْت، وَأَتْبِعْ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقْ النَّاسَ بِخُلُقٍ حَسَنٍ . رَوَاهُ التِّرْمِذِيُّ [رقم:1987] وَقَالَ: حَدِيثٌ حَسَنٌ، وَفِي بَعْضِ النُّسَخِ: حَسَنٌ صَحِيحٌ", "source_tr": "Tirmizi, Tirmizi’nin hasen olduğunu söylediği bu hadisin, Ahmed, el-Bezzar, et-Taberani, el-Hakim ve İbn Abdilber ve başkalarında başka tarikleri vardır.", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 19, "title_tr": "ALLAH'IN YARDIMI, KORUMASI VE DESTEĞİ", "title_en": "Allah's Protection", "title_ar": "الحديث التاسع عشر", "hadith_tr": "Ebu’l Abbas, Abdullah bin Abbas (radiyallahu anh) şöyle anlattı: Bir gün, Resulullah’ın (sallallahu aleyhi ve sellem) bindiği hayvanın terkisindeydim (arkasına binmiştim). Dedi ki: - “Yavrum! Sana birkaç söz öğreteceğim; Allah’ın (celle celaluhu) emir ve yasaklarını gözet ki, Allah da (celle celaluhu) seni gözetsin. Allah’ı (celle celaluhu) gözet ki, onu karşında (hazır) bulasın. İsteyeceğin zaman Allah’tan (celle celaluhu) iste. Yardım dileyeceğin zaman Allah’tan (celle celaluhu) yardım dile. Bilmiş ol ki, bütün insanlar, herhangi bir hususta sana fayda vermek için bir araya gelmiş olsa, ancak Allah’ın (celle celaluhu) senin için takdir ettiği hususta (ve takdir ettiği kadar) sana yararlı olabilirler. Aynı zamanda, sana herhangi bir hususta zarar vermek için bir araya gelmiş olsalar, ancak Allah’ın takdir ettiği kadarıyla sana zarar verebilirler. Çünkü kalemler, (vaki olacak her şeyi tespit ettikten sonra) kaldırılmış, sayfaların mürekkebi kurumuştur. (Artık kaderi değiştirme imkanı kalmamıştır.)” Hadisin başka bir rivayeti de şöyledir: “Allah’ı (celle celaluhu)'ı gözet ki, onu karşında bulasın. Bolluk ve genişlik zamanında, Allah’ı (celle celaluhu) an ki, sıkıntıda da o seni ansın (İhtiyacını görüp sıkıntını gidersin). Şunu bil ki: Sana gelmeyen, (kaderine yazılmayan), başına gelecek değildir. Sana gelecek musibet de, gelmeyecek değildir. Zaferin sabırla birlikte, sevincin kederle birlikte, kolaylığın da zorlukla birlikte olduğunu bil.”", "hadith_en": "On the authority of Abu Abbas Abdullah bin Abbas (may Allah be pleased with him) who said: One day I was behind the Prophet (peace and blessings of Allah be upon him) [riding on the same mount] and he said, “O young man, I shall teach you some words [of advice]: Be mindful of Allah and Allah will protect you. Be mindful of Allah and you will find Him in front of you. If you ask, then ask Allah [alone]; and if you seek help, then seek help from Allah [alone]. And know that if the nation were to gather together to benefit you with anything, they would not benefit you except with what Allah had already prescribed for you. And if they were to gather together to harm you with anything, they would not harm you except with what Allah had already prescribed against you. The pens have been lifted and the pages have dried.” It was related by at-Tirmidhi, who said it was a good and sound hadeeth. Another narration, other than that of Tirmidhi, reads: Be mindful of Allah, and you will find Him in front of you. Recognize and acknowledge Allah in times of ease and prosperity, and He will remember you in times of adversity. And know that what has passed you by [and you have failed to attain] was not going to befall you, and what has befallen you was not going to pass you by. And know that victory comes with patience, relief with affliction, and hardship with ease", "hadith_ar": "عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: \"كُنْت خَلْفَ رَسُولِ اللَّهِ صلى الله عليه و سلم يَوْمًا، فَقَالَ: يَا غُلَامِ! إنِّي أُعَلِّمُك كَلِمَاتٍ: احْفَظْ اللَّهَ يَحْفَظْك، احْفَظْ اللَّهَ تَجِدْهُ تُجَاهَك، إذَا سَأَلْت فَاسْأَلْ اللَّهَ، وَإِذَا اسْتَعَنْت فَاسْتَعِنْ بِاَللَّهِ، وَاعْلَمْ أَنَّ الْأُمَّةَ لَوْ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوك بِشَيْءٍ لَمْ يَنْفَعُوك إلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَك، وَإِنْ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوك بِشَيْءٍ لَمْ يَضُرُّوك إلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْك؛ رُفِعَتْ الْأَقْلَامُ، وَجَفَّتْ الصُّحُفُ\" . رَوَاهُ التِّرْمِذِيُّ [رقم:2516] وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ. وَفِي رِوَايَةِ غَيْرِ التِّرْمِذِيِّ: \"احْفَظْ اللَّهَ تَجِدْهُ أمامك، تَعَرَّفْ إلَى اللَّهِ فِي الرَّخَاءِ يَعْرِفُك فِي الشِّدَّةِ، وَاعْلَمْ أَنَّ مَا أَخْطَأَك لَمْ يَكُنْ لِيُصِيبَك، وَمَا أَصَابَك لَمْ يَكُنْ لِيُخْطِئَك، وَاعْلَمْ أَنَّ النَّصْرَ مَعَ الصَّبْرِ، وَأَنْ الْفَرَجَ مَعَ الْكَرْبِ، وَأَنَّ مَعَ الْعُسْرِ يُسْرًا", "source_tr": "Tirmizi, Ahmed b. Hanbel ve Abdullah b. Humeyd", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 20, "title_tr": "HAYÂ (UTANMA) İMANDANDIR", "title_en": "Modesty is from Faith", "title_ar": "الحديث العشرون", "hadith_tr": "Ebu Mes’ud Ukbe bin Amr el-Ensari el-Bedri’den (radiyallahu anh) rivayet edildiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “İnsanların ilk peygamberlikten beri, peygamberlerden duyduğu sözlerden birisi şudur: “Utanmazsan dilediğini yap.”", "hadith_en": "On the authority of Abu Masood Uqbah bin ’Amr al-Ansaree al-Badree (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Verily, from what was learnt by the people from the speech of the earliest prophecy is: If you feel no shame, then do as you wish.” [Al-Bukhari]", "hadith_ar": "عَنْ أَبِي مَسْعُودٍ عُقْبَةَ بْنِ عَمْرٍو الْأَنْصَارِيِّ الْبَدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم إنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الْأُولَى: إذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْت .<br>[رَوَاهُ الْبُخَارِيُّ]", "source_tr": "Buhari, Ebu Davud ve İbn Mace", "source_en": "Al-Bukhari", "source_ar": "Al-Bukhari"}, {"id": 21, "title_tr": "DOĞRULUK VE İMAN", "title_en": "Steadfastness", "title_ar": "الحديث الحادي والعشرون", "hadith_tr": "Ebu Amr (başka bir ifadeyle Ebu Amra) Süfyan bin Abdullah es-Sekafi (radiyallahu anh) şöyle dedi: - Allah (celle celaluhu) Resulüne (sallallahu aleyhi ve sellem): “İslam hakkında bir söz söyle ki senden başka hiç kimseye bir şey sormayayım.” dedim. Resulullah (sallallahu aleyhi ve sellem) şu cevabı verdi: - Allah’a (celle celaluhu) inandım, de; sonra da istikamet üzere (dosdoğru) ol.”", "hadith_en": "On the authority of Abu `Amr — and he is also called Abu `Amrah — Sufyan bin Abdullah ath- Thaqafee (may Allah be pleased with him) who said: I said, \"O Messenger of Allah, tell me something about al-Islam which I can ask of no one but you.\" He (peace and blessings of Allah be upon him) said, \"Say I believe in Allah — and then be steadfast.\" [Muslim]", "hadith_ar": "عَنْ أَبِي عَمْرٍو وَقِيلَ: أَبِي عَمْرَةَ سُفْيَانَ بْنِ عَبْدِ اللَّهِ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْت: يَا رَسُولَ اللَّهِ! قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَك؛ قَالَ: قُلْ: آمَنْت بِاَللَّهِ ثُمَّ اسْتَقِمْ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim, Tirmizi ve İbn Mace", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 22, "title_tr": "CENNET YOLU", "title_en": "The Path to Paradise", "title_ar": "الحديث الثاني والعشرون", "hadith_tr": "Ebu Abdillah Cabir bin Abdullah el-Ensari (radiyallahu anh) şöyle rivayet etti: Birisi Resulullah’a (sallallahu aleyhi ve sellem) gelerek: -Ne dersin; farz namazları kıldığım, Ramazan orucumu tuttuğum, helal olanı helal olarak kabul edip haram olanı da haram saydığım ve çekindiğim ve bunlara kendiliğimden bir şey katmadığım takdirde cennete girer miyim? diye sordu. Peygamber (sallallahu aleyhi ve sellem): - Evet, diyerek karşılık verdi.", "hadith_en": "On the authority of Abu Abdullah Jabir bin Abdullah al-Ansaree (may Allah be pleased with him) that: A man questioned the Messenger of Allah (peace and blessings of Allah be upon him) and said, “Do you think that if I perform the obligatory prayers, fast in Ramadhan, treat as lawful that which is halal, and treat as forbidden that which is haram, and do not increase upon that [in voluntary good deeds], then I shall enter Paradise?” He (peace and blessings of Allah be upon him) replied, “Yes.” [Muslim]", "hadith_ar": "عَنْ أَبِي عَبْدِ اللَّهِ جَابِرِ بْنِ عَبْدِ اللَّهِ الْأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ صلى الله عليه و سلم فَقَالَ: أَرَأَيْت إذَا صَلَّيْت الْمَكْتُوبَاتِ، وَصُمْت رَمَضَانَ، وَأَحْلَلْت الْحَلَالَ، وَحَرَّمْت الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا؛ أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: نَعَمْ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 23, "title_tr": "HER HAYIR SADAKADIR", "title_en": "Every Good Deed is Charity", "title_ar": "الحديث الثالث والعشرون", "hadith_tr": "Ebu Malik el-Haris bin Asım el-Eş’ari’den (radiyallahu anh) rivayet edildiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Temizlik imanın yarısıdır. Elhamdulillah sözü (nün sevabı) mizanı doldurur. Subhanellahi ve’l-hamdulillah, gökle yer arasını doldurur. Namaz nurdur, sadaka delildir, sabır ışıktır. Kur’ân, senin lehine veya aleyhine bir hüccettir (delildir). Her yeni bir güne sabahlayan kişi, kendi nefsini pazarlayan konumundadır. Kimisi yapılan alış verişte kendini kurtarır, kimisi de kendini mahvedip helak eder.”", "hadith_en": "On the authority of Abu Malik al-Harith bin Asim al-Asharee (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Purity is half of iman (faith). ‘Al-hamdu lillah (praise be to Allah)’ fills the scales, and ‘subhan-Allah (how far is Allah from every imperfection) and ‘Al-hamdulillah (praise be to Allah)’ fill that which is between heaven and earth. And the salah (prayer) is a light, and charity is a proof, and patience is illumination, and the Qur’an is a proof either for you or against you. Every person starts his day as a vendor of his soul, either freeing it or causing its ruin.” [Muslim]", "hadith_ar": "عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم الطَّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ -أَوْ: تَمْلَأُ- مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَك أَوْ عَلَيْك، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 24, "title_tr": "ZULMETMEK HARAMDIR", "title_en": "Prohibition of Injustice", "title_ar": "الحديث الرابع والعشرون", "hadith_tr": "Sa’d bin Abdulaziz, Rabia bin Yezid, Ebu İdris Havlanî ve Ebu Zer Cundüb bin Cunâde’den rivayet olunduğuna göre, Resulullah’ın (sallallahu aleyhi ve sellem) Rabbinden (celle celaluhu) naklettiği bir Kudsî hadiste: Allah-u Teâ’ala buyuruyor ki: “Ey kullarım! Ben zulmü kendime haram kıldım. Sizin aranızda da onu haram kıldım. Öyleyse birbirinize zulmetmeyin. Kullarım! Benim hidayet ettiklerimden başka hepiniz sapıklığa düşmeye mahkûmsunuz. Hidayet isteyin, sizi doğru yola ileteyim. Kullarım! Benim doyurduklarımdan başka hepiniz aç kalmaya mahkûmsunuz. Benden rızık isteyin, size rızık vereyim. Kullarım! Ben giydirdiklerimden başka hepiniz çıplak kalmaya mahkûmsunuz. Benden giyecek isteyin, sizi giydireyim. Ey kullarım! Siz, gece gündüz hata işliyorsunuz. Ben ise bütün günahları bağışlarım. Benden mağfiret dileyin, sizi bağışlayayım. Kullarım! Siz bana zarar veremezsiniz ki, zarar veresiniz. Fayda veremezsiniz ki faydanız dokunsun. Ey kullarım! Siz insanıyla ciniyle birincinizden en sonuncunuza varıncaya kadar hepiniz, en muttaki bir kişinin kalbi üzere olsanız, (hepiniz evliya olasanız) bu benim mülkümde hiçbir şey artırmaz. Yine ilkinizden en sonuncunuza, insanınız cininiz (hepiniz), en facir bir kimsenin kalbi üzere olsanız, (hepiniz küfre, fızk-u fücura sapsanız) bu da benim mülkümden bir şey eksiltmez. Ey kullarım! Önce ve sonra geleniyle bütün insan ve cinler bir meydanda toplanıp benden isteseler, ben onların her birine tüm istediklerini versem, benim hazinemden bir şey eksilmiş olmaz. Bu, denize batırılan bir iğnenin deniz suyundan su eksiltmesi gibidir. Kullarım! Ben sizin bütün amellerinizi sayıyor ve tespit ediyorum. Sonra da karşılığını (eksiksiz olarak) vereceğim. Yaptığının karşılığı olarak hayra ve sevaba kavuşan Allah’a (celle celaluhu) hamdetsin. Başka şeyler bulan da sadece kendisini kınasın.”", "hadith_en": "On the authority of Abu Dharr al-Ghifaree (may Allah be pleased with him) from the Prophet (peace and blessings of Allah be upon him) from his Lord, that He said: O My servants! I have forbidden dhulm (oppression) for Myself, and I have made it forbidden amongst you, so do not oppress one another. O My servants, all of you are astray except those whom I have guided, so seek guidance from Me and I shall guide you. O My servants, all of you are hungry except those whom I have fed, so seek food from Me and I shall feed you. O My servants, all of you are naked except those whom I have clothed, so seek clothing from Me and I shall clothe you. O My servants, you commit sins by day and by night, and I forgive all sins, so seek forgiveness from Me and I shall forgive you. O My servants, you will not attain harming Me so as to harm Me, and you will not attain benefiting Me so as to benefit Me. O My servants, if the first of you and the last of you, and the humans of you and the jinn of you, were all as pious as the most pious heart of any individual amongst you, then this would not increase My Kingdom an iota. O My servants, if the first of you and the last of you, and the humans of you and the jinn of you, were all as wicked as the most wicked heart of any individual amongst you, then this would not decrease My Kingdom an iota. O My servants, if the first of you and the last of you, and the humans of you and the jinn of you, were all to stand together in one place and ask of Me, and I were to give everyone what he requested, then that would not decrease what I Possess, except what is decreased of the ocean when a needle is dipped into it. O My servants, it is but your deeds that I account for you, and then recompense you for. So he who finds good, let him praise Allah, and he who finds other than that, let him blame no one but himself. [Muslim]", "hadith_ar": "عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، أَنَّهُ قَالَ: يَا عِبَادِي: إنِّي حَرَّمْت الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْته بَيْنَكُمْ مُحَرَّمًا؛ فَلَا تَظَالَمُوا. يَا عِبَادِي! كُلُّكُمْ ضَالٌّ إلَّا مَنْ هَدَيْته، فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي! كُلُّكُمْ جَائِعٌ إلَّا مَنْ أَطْعَمْته، فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي! كُلُّكُمْ عَارٍ إلَّا مَنْ كَسَوْته، فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي! إنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا؛ فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي! إنَّكُمْ لَنْ تَبْلُغُوا ضُرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ، فَسَأَلُونِي، فَأَعْطَيْت كُلَّ وَاحِدٍ مَسْأَلَته، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إلَّا كَمَا يَنْقُصُ الْمِخْيَطُ إذَا أُدْخِلَ الْبَحْرَ. يَا عِبَادِي! إنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إيَّاهَا؛ فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدْ اللَّهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلَا يَلُومَن إلَّا نَفْسَهُ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 25, "title_tr": "YÜCE ALLAH’IN LÜTFU VE BOL RAHMETİ", "title_en": "The Value of Charity", "title_ar": "الحديث الخامس والعشرون", "hadith_tr": "Ebu Zer (radiyallahu anh) şöyle rivayet etti: Resulullah’ın (sallallahu aleyhi ve sellem) ashabından (radiyallahu anh) bazıları ona: - Ya Resulullah (sallallahu aleyhi ve sellem)! Zenginler ecirleri (sevap ve mükâfatları) alıp götürdüler. Hâlbuki bizim namaz kıldığımız gibi onlar da kılıyor ve bizim oruç tutuğumuz gibi onlar da tutuyorlar. Üstelik mallarının fazlasıyla da sadaka veriyorlar. (Dolayısıyla biz hayır yarışında onlardan çok geri kaldık. Bize yol göster.) dediler. Peygamber (sallallahu aleyhi ve sellem) şöyle buyurdu: - Allah-u Teâ’ala, size sadaka verme imkânı tanımadı mı zannediyorsunuz? Her tesbihte, sizin için sadaka (sevabı) vardır. Her tekbir, her tahmid, her tehlil, her iyiliği emretme, her kötülükten sakındırma (karşılığında) bir sadaka vardır. Hatta sizden birinin ailesiyle münasebetinde bile sadaka ecri vardır. Onlar: - Ya Resulullah (sallallahu aleyhi ve sellem)! Şehevi arzumuzu yerine getirmekte de sevap olur mu? dediler. Peygamber (sallallahu aleyhi ve sellem) şöyle cevap verdi: - Bu arzuyu haram yoldan giderseniz, size günah olmayacak mıydı? İşte arzunuzu helal yoldan giderdiğiniz takdirde, sizin için sevap ve mükâfat vardır.", "hadith_en": "Also on the authority of Abu Dharr (may Allah be pleased with him): Some people from amongst the Companions of the Messenger of Allah (peace and blessings of Allah be upon him) said to the Prophet (peace and blessings of Allah be upon him), \"O Messenger of Allah, the affluent have made off with the rewards; they pray as we pray, they fast as we fast, and they give [much] in charity by virtue of their wealth.\" He (peace and blessings of Allah be upon him) said, \"Has not Allah made things for you to give in charity? Truly every tasbeehah [saying: 'subhan-Allah'] is a charity, and every takbeerah [saying: 'Allahu akbar'] is a charity, and every tahmeedah [saying: 'al-hamdu lillah'] is a charity, and every tahleelah [saying: 'laa ilaha illAllah'] is a charity. And commanding the good is a charity, and forbidding an evil is a charity, and in the bud`i [sexual act] of each one of you there is a charity.\" They said, \"O Messenger of Allah, when one of us fulfils his carnal desire will he have some reward for that?\" He (peace and blessings of Allah be upon him) said, \"Do you not see that if he were to act upon it [his desire] in an unlawful manner then he would be deserving of punishment? Likewise, if he were to act upon it in a lawful manner then he will be deserving of a reward.\" [Muslim]", "hadith_ar": "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ أَيْضًا، أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالُوا لِلنَّبِيِّ صلى الله عليه و سلم يَا رَسُولَ اللَّهِ ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ؛ يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِمَعْرُوفٍ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ. قَالُوا: يَا رَسُولَ اللَّهِ أَيَأْتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إذَا وَضَعَهَا فِي الْحَلَالِ، كَانَ لَهُ أَجْرٌ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 26, "title_tr": "İNSANLARIN ARASINI DÜZELTMEK VE ONLARA ADALETLE DAVRANMAK", "title_en": "What is Charity?", "title_ar": "الحديث السادس والعشرون", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “İnsanın, vücudundaki her eklemin karşılığında, her gün, bir sadaka borcu vardır. İnsan, iki kişi arasında adaletle hükmeder, bu bir sadaka olur. Güzel söz bir sadakadır. Namaz için atılan her adımda sadaka sevabı vardır. Rahatsızlık veren bir şeyi kaldırır, o da bir sadaka olur.” 1 Buharî ve Müslim", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Every joint of a person must perform a charity each day that the sun rises: to judge justly between two people is a charity. To help a man with his mount, lifting him onto it or hoisting up his belongings onto it, is a charity. And the good word is a charity. And every step that you take towards the prayer is a charity, and removing a harmful object from the road is a charity.” [Al-Bukhari] [Muslim]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم كُلُّ سُلَامَى مِنْ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنْ الطَّرِيقِ صَدَقَةٌ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 27, "title_tr": "İYİLİK VE GÜNAH", "title_en": "Righteousness and Sin", "title_ar": "الحديث السابع والعشرون", "hadith_tr": "En-Nevvas bin Sem’ân (radiyallahu anh) Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu rivayet etti: “İyilik, güzel ahlâk demektir. Günah ise, içini rahatsız eden ve insanların haberdar olmasını istemediğin şeydir.” Ayrıca Vâbisa b. Ma’bed’den (radiyallahu anh) de şöyle rivayet edilmiştir: Resulullah’a (sallallahu aleyhi ve sellem) geldim. O bana: - İyiliğin ne olduğunu sormaya mı geldin? dedi. Ben de: - Evet, dedim. O (sallallahu aleyhi ve sellem): - Kalbine danış. İyilik; vicdanın, yaptığın için huzur duyduğu, kalbin tereddüde düşmediği hareketlerdir. Kötülük ise, (insanlar) doğru bulsalar ve iyidir deseler bile içini rahatsız eden, kalbinde tereddüt meydana getirendir.", "hadith_en": "On the authority of an-Nawas bin Sam’an (may Allah be pleased with him), that the Prophet (peace and blessings of Allah be upon him) said: Righteousness is in good character, and wrongdoing is that which wavers in your soul, and which you dislike people finding out about. [Muslim] And on the authority of Wabisah bin Ma’bad (may Allah be pleased with him) who said: I came to the Messenger of Allah (peace and blessings of Allah be upon him) and he (peace and blessings of Allah be upon him) said, “You have come to ask about righteousness.” I said, “Yes.” He (peace and blessings of Allah be upon him) said, “Consult your heart. Righteousness is that about which the soul feels at ease and the heart feels tranquil. And wrongdoing is that which wavers in the soul and causes uneasiness in the breast, even though people have repeatedly given their legal opinion [in its favour].” A good hadeeth transmitted from the musnads of the two imams, Ahmed bin Hambal and Al- Darimi, with a good chain of authorities", "hadith_ar": "عَنْ النَّوَّاسِ بْنِ سَمْعَانَ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: \"الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِك، وَكَرِهْت أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ\" رَوَاهُ مُسْلِمٌ [رَوَاهُ مُسْلِمٌ]. وَعَنْ وَابِصَةَ بْنِ مَعْبَدٍ رَضِيَ اللهُ عَنْهُ قَالَ: أَتَيْت رَسُولَ اللَّهِ صلى الله عليه و سلم فَقَالَ: \"جِئْتَ تَسْأَلُ عَنْ الْبِرِّ؟ قُلْت: نَعَمْ. فقَالَ: استفت قلبك، الْبِرُّ مَا اطْمَأَنَّتْ إلَيْهِ النَّفْسُ، وَاطْمَأَنَّ إلَيْهِ الْقَلْبُ، وَالْإِثْمُ مَا حَاكَ فِي النَّفْسِ وَتَرَدَّدَ فِي الصَّدْرِ، وَإِنْ أَفْتَاك النَّاسُ وَأَفْتَوْك\" . حَدِيثٌ حَسَنٌ، رَوَيْنَاهُ في مُسْنَدَي الْإِمَامَيْنِ أَحْمَدَ بْنِ حَنْبَلٍ [رقم:4/227]، وَالدَّارِمِيّ [2/246] بِإِسْنَادٍ حَسَنٍ", "source_tr": "Müslim. 2\t Hasen bir isnatla Ahmed b. Hanbel’le ed-Dârimî ‘nin Musned’lerinde rivayet edilmiştir. En-Nevvas b. Sem’ân’ın hadisi: Müslim’de rivayet edilmiştir.", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 28, "title_tr": "SÜNNETE BAĞLILIK VE BİD'ATLARDAN UZAK DURMAK", "title_en": "Adherence to the Sunnah", "title_ar": "الحديث الثامن والعشرون", "hadith_tr": "Ebu Necîh el-İrbad bin Sariye (radiyallahu anh) şunu anlattı: Resulullah (sallallahu aleyhi ve sellem) bize, kalpleri ürperten, gözleri yaşartan bir nasihatta bulundu. Biz de şöyle dedik: - Ya Resulullah (sallallahu aleyhi ve sellem)! Bu yaptığın konuşma, (vefatı yaklaşıp da) vedalaşan bir kimsenin nasihatına benziyor. O halde bize tavsiyede bulun. Bunun üzerine Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: - “Size Allah’tan (celle celaluhu) korkmanızı, idareciniz zenci bir köle bile olsa, ona itaat etmenizi tavsiye ediyorum. Çünkü sizin aranızda yaşayanlardan bazıları, birçok ihtilâflar görecekler. O halde siz, benim sünnetime ve raşid (doğru yolda olan) ve hidayete erişmiş halifelerin sünnetine sarılın. Onlara (dişlerinizle ısırır gibi) sımsıkı sarılın. Dinî konularda sonradan ortaya çıkarılan bid’atlardan da sakının. Çünkü her bid’at sapıklıktır.”", "hadith_en": "On the authority of Abu Najeeh al-’Irbaad ibn Saariyah (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) gave us a sermon by which our hearts were filled with fear and tears came to our eyes. So we said, “O Messenger of Allah! It is as though this is a farewell sermon, so counsel us.” He (peace and blessings of Allah be upon him) said, “I counsel you to have taqwa (fear) of Allah, and to listen and obey [your leader], even if a slave were to become your ameer. Verily he among you who lives long will see great controversy, so you must keep to my Sunnah and to the Sunnah of the Khulafa ar-Rashideen (the rightly guided caliphs), those who guide to the right way. Cling to it stubbornly [literally: with your molar teeth]. Beware of newly invented matters [in the religion], for verily every bidah (innovation) is misguidance.” [Abu Dawud] It was related by at-Tirmidhi, who said that it was a good and sound hadeeth", "hadith_ar": "عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللَّهِ صلى الله عليه و سلم مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ! كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا، قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ؛ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ . [رَوَاهُ أَبُو دَاوُدَ]، وَاَلتِّرْمِذِيُّ [رقم:266] وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ", "source_tr": "Ebu Davud, Tirmizî ve İbn Mâce", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 29, "title_tr": "HAYIR KAPILARI VE DOĞRULUK YOLLARI", "title_en": "Means of Goodness", "title_ar": "الحديث التاسع والعشرون", "hadith_tr": "Muaz bin Cebel (radiyallahu anh) derki: - Ya Resulullah (sallallahu aleyhi ve sellem)! Beni cennete koyacak, cehennemden de uzaklaştıracak bir ameli bana haber ver, dedim. O da şöyle cevap verdi: - Çok büyük bir şey sordun. Ancak o amel, Allah’ın (celle celaluhu) kolaylık vereceği kimseye pek kolaydır. Sen, Allah’a (celle celaluhu) kulluk eder, ona hiçbir ortak tanımazsın. Namazı dosdoğru kılar, zekâtı verir. Ramazan orucunu tutar ve gücün yeterse haccedersin. Resulullah (sallallahu aleyhi ve sellem) sözüne şöyle devam etti: “Sana hayır kapılarını göstereyim mi? Oruç, kötülüklere karşı bir kalkan; sadaka, suyun ateşi söndürdüğü gibi, günahları söndürür. Kişinin geceleyin kıldığı namaz da hayır çeşitlerindedir.” Bundan sonra da şu âyeti okudu: “Korkuyla ve umutla Rablerine yalvarmak üzere (ibadet ettikleri için) vücutları yataklardan uzak kalır ve kendilerine verdiğimiz rızıktan Allah (celle celaluhu) yolunda harcarlar. Yaptıklarına karşılık olarak, onlar için ne mutluluklar saklandığını hiç kimse bilemez.” Resulullah (sallallahu aleyhi ve sellem): “Din işinin esası, direği ve zirvesi nedir, sana öğreteyim mi?” dedi. Ben de: - Evet, Ya Resulullah (sallallahu aleyhi ve sellem)! dedim. O da: - İşin başı İslam’dır. Direği namazdır, zirvesi de cihaddır, cevabını verdi. Daha sonra: - Bu dediklerinin hepsinin daha önemli olanını sana haber vereyim mi? dedi. Ben de: - Evet, Ya Resulullah (sallallahu aleyhi ve sellem)! dedim. O da dilini tutarak: - Şunu korumaya çalış, dedi. Ben: - Ya Resulullah (sallallahu aleyhi ve sellem)! Biz, söylediğimiz sözler yüzünden hesaba çekilecek miyiz? diye sordum. Hz. Peygamber: - Anan seni yitiresice Muaz! Herkesi cehenneme yüzleri yahut burunları üzere sürükleyen, dillerinin biçip devşirdiği kötülükler değil midir? cevabını verdi. 1 Secde, 16-. 2 Tirmizî", "hadith_en": "On the authority of Muadh bin Jabal (may Allah be pleased with him) who said: I said, “O Messenger of Allah, tell me of an act which will take me into Paradise and will keep me away from the Hellfire.” He (peace and blessings of Allah be upon him) said, “You have asked me about a great matter, yet it is easy for him for whom Allah makes it easy: worship Allah, without associating any partners with Him; establish the prayer; pay the zakat; fast in Ramadhan; and make the pilgrimage to the House.” Then he (peace and blessings of Allah be upon him) said, “Shall I not guide you towards the means of goodness? Fasting is a shield; charity wipes away sin as water extinguishes fire; and the praying of a man in the depths of the night.” Then he (peace and blessings of Allah be upon him) recited: “[Those] who forsake their beds, to invoke their Lord in fear and hope, and they spend (charity in Allah’s cause) out of what We have bestowed on them. No person knows what is kept hidden for them of joy as a reward for what they used to do.” [as-Sajdah, 16-17] Then he (peace and blessings of Allah be upon him) said, “Shall I not inform you of the head of the matter, its pillar and its peak?” I said, “Yes, O Messenger of Allah.” He (peace and blessings of Allah be upon him) said, “The head of the matter is Islam, its pillar is the prayer and its peak is jihad.” Then he (peace and blessings of Allah be upon him) said, “Shall I not tell you of the foundation of all of that?” I said, “Yes, O Messenger of Allah.” So he took hold of his tongue and said, “Restrain this.” I said, “O Prophet (ﷺ) of Allah, will we be taken to account for what we say with it?” He (peace and blessings of Allah be upon him) said, “May your mother be bereaved of you, O Muadh! Is there anything that throws people into the Hellfire upon their faces — or: on their noses — except the harvests of their tongues?” It was related by at-Tirmidhi, who said it was a good and sound hadeeth", "hadith_ar": "عَنْ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْت يَا رَسُولَ اللَّهِ! أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدْنِي مِنْ النَّارِ، قَالَ: \"لَقَدْ سَأَلْت عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكْ بِهِ شَيْئًا، وَتُقِيمُ الصَّلَاةَ، وَتُؤْتِي الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ الْبَيْتَ، ثُمَّ قَالَ: أَلَا أَدُلُّك عَلَى أَبْوَابِ الْخَيْرِ؟ الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ، وَصَلَاةُ الرَّجُلِ فِي جَوْفِ اللَّيْلِ، ثُمَّ تَلَا: \" تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ \" حَتَّى بَلَغَ \"يَعْمَلُونَ\"،[ 32 سورة السجدة / الأيتان : 16 و 17 ] ثُمَّ قَالَ: أَلَا أُخْبِرُك بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذُرْوَةِ سَنَامِهِ؟ قُلْت: بَلَى يَا رَسُولَ اللَّهِ. قَالَ: رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذُرْوَةُ سَنَامِهِ الْجِهَادُ، ثُمَّ قَالَ: أَلَا أُخْبِرُك بِمَلَاكِ ذَلِكَ كُلِّهِ؟ فقُلْت: بَلَى يَا رَسُولَ اللَّهِ ! فَأَخَذَ بِلِسَانِهِ وَقَالَ: كُفَّ عَلَيْك هَذَا. قُلْت: يَا نَبِيَّ اللَّهِ وَإِنَّا لَمُؤَاخَذُونَ بِمَا نَتَكَلَّمُ بِهِ؟ فَقَالَ: ثَكِلَتْك أُمُّك وَهَلْ يَكُبُّ النَّاسَ عَلَى وُجُوهِهِمْ -أَوْ قَالَ عَلَى مَنَاخِرِهِمْ- إلَّا حَصَائِدُ أَلْسِنَتِهِمْ؟!\" . رَوَاهُ التِّرْمِذِيُّ [رقم:2616] وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 30, "title_tr": "YÜCE ALLAH’IN KOYDUĞU HADLER (SINIRLAR) VE HARAMLAR", "title_en": "Limits of Allah", "title_ar": "الحديث الثلاثون", "hadith_tr": "Ebu Sa’lebe el-Huşenî Cursûm bin Nâşir (radiyallahu anh) Resulullah’tan (sallallahu aleyhi ve sellem) şunu rivayet etti: “Yüce Allah bazı farzlar koymuştur. Onları yerine getirin, zayi etmeyin. Allah birtakım sınırlar koymuştur, bunları geçmeyin (çiğnemeyin). Bazı şeyleri de haram kılmıştır. Onları çiğnemeyin. Bazı şeylerde de, unuttuğundan değil, size merhametinden dolayı susmuştur. Onları araştırıp durmayın.” 1 Ed-Dârakutni, Hasen", "hadith_en": "On the authority of Abu Tha’labah al-Kushanee — Jurthoom bin Nashir (may Allah be pleased with him) — that the Messenger of Allah (peace and blessings of Allah be upon him) said: Verily Allah ta’ala has laid down religious obligations (fara’id), so do not neglect them; and He has set limits, so do not overstep them; and He has forbidden some things, so do not violate them; and He has remained silent about some things, out of compassion for you, not forgetfulness — so do not seek after them. A hasan hadeeth narrated by ad-Daraqutnee and others", "hadith_ar": "عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ جُرْثُومِ بن نَاشِر رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَال: \"إنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا\". حَدِيثٌ حَسَنٌ، رَوَاهُ الدَّارَقُطْنِيّ ْ\"في سننه\" [4/184]، وَغَيْرُهُ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 31, "title_tr": "ZÜHDÜN GERÇEK ANLAMI VE SONUÇLARI", "title_en": "Asceticism", "title_ar": "الحديث الحادي والثلاثون", "hadith_tr": "Ebu’l Abbas Sehl bin Sa’d es-Sâidî (radiyallahu anh) şunu anlattı: Bir adam Hz. Peygamber’e gelip şöyle dedi: - Ya Resulullah (sallallahu aleyhi ve sellem)! Bana bir amel göster ki, onu yaptığım takdirde, Allah (celle celaluhu) da insanlar da beni sevsinler. Peygamber (sallallahu aleyhi ve sellem) şöyle cevap verdi: - Dünyaya gönül bağlama. Böyle yaptığın takdirde, Allah (celle celaluhu) seni sever. İnsanların sahip olduğu şeylerden de uzak dur. Böyle yaparsan insanlar seni sever. 1 İbn Mâce, İbn Allân, Et-Taberânî, İbn Hıbban, el-Hâkim ve el-Beyhakî, Hasen", "hadith_en": "On the authority of Abu al-’Abbas Sahl bin Sa’ad as-Sa’idee (may Allah be pleased with him) who said: A man came to the Prophet (peace and blessings of Allah be upon him) and said, “O Messenger of Allah, direct me to an act which, if I do it, [will cause] Allah to love me and the people to love me.” So he (peace and blessings of Allah be upon him) said, “Renounce the world and Allah will love you, and renounce what the people possess and the people will love you.” A hasan hadeeth related by Ibn Majah and others with good chains of authorities", "hadith_ar": "عَنْ أَبِي الْعَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيّ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إلَى النَّبِيِّ صلى الله عليه و سلم فَقَالَ: يَا رَسُولَ اللهِ! دُلَّنِي عَلَى عَمَلٍ إذَا عَمِلْتُهُ أَحَبَّنِي اللهُ وَأَحَبَّنِي النَّاسُ؛ فَقَالَ: ازْهَدْ فِي الدُّنْيَا يُحِبَّك اللهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّك النَّاسُ . حديث حسن، رَوَاهُ ابْنُ مَاجَهْ [رقم:4102]، وَغَيْرُهُ بِأَسَانِيدَ حَسَنَةٍ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 32, "title_tr": "İSLAM’DA ZARAR VERME YOKTUR", "title_en": "No Harm or Reciprocating Harm", "title_ar": "الحديث الثاني والثلاثون", "hadith_tr": "Ebu Saîd Sa’d bin Sinan el-Hudrî (radiyallahu anh) Resulullah’tan (sallallahu aleyhi ve sellem) şöyle rivayet etti: “Zarara uğrama da zarar verme de yoktur. Zarara, zararla karşılık verme de yoktur.” 1 İbn Mâce, İmam Mâlik, el-Hâkim ve el-Beyhakî, Hasen", "hadith_en": "On the authority of Abu Sa’eed al-Khudree (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: There should be neither harming (darar) nor reciprocating harm (dirar). A hasan hadeeth related by Ibn Majah, ad-Daraqutnee and others as a musnad hadeeth. It was also related by Malik in al-Muwatta in mursal form from Amr bin Yahya, from his father from the Prophet (peace and blessings of Allah be upon him), but leaving Abu Sa’eed from the chain. And it has other chains of narrations that strengthen one another", "hadith_ar": "عَنْ أَبِي سَعِيدٍ سَعْدِ بْنِ مَالِكِ بْنِ سِنَانٍ الْخُدْرِيّ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \" لَا ضَرَرَ وَلَا ضِرَارَ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ ابْنُ مَاجَهْ [راجع رقم:2341]، وَالدَّارَقُطْنِيّ [رقم:4/228]، وَغَيْرُهُمَا مُسْنَدًا. وَرَوَاهُ مَالِكٌ [2/746] فِي \"الْمُوَطَّإِ\" عَنْ عَمْرِو بْنِ يَحْيَى عَنْ أَبِيهِ عَنْ النَّبِيِّ صلى الله عليه و سلم مُرْسَلًا، فَأَسْقَطَ أَبَا سَعِيدٍ، وَلَهُ طُرُقٌ يُقَوِّي بَعْضُهَا بَعْضًا", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 33, "title_tr": "İSLÂM HUKUKUNUN ESASLARI", "title_en": "On Evidence and Oaths", "title_ar": "الحديث الثالث والثلاثون", "hadith_tr": "Abdullah bin Abbas (radiyallahu anh) Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu rivayet etmektedir: “İnsanlara, iddia ettikleri için istedikleri verilse çoğu kimse başkalarının mallarını ve kanlarını iddia eder. Ancak davanın ispatı için delil getirmek iddia edene (davacı), ispat edemediği takdirde yemin ederek davayı reddetmek de davalıya (inkâr edene) aittir.” 1 El-Beyhakî, bir kısmı Buharî ve Müslim’in Sahihlerinde geçmektedir, Ebu Davud, Nesaî, Tirmi
