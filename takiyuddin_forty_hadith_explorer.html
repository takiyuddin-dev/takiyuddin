zî ve İbn Mâce, hadis Hasen", "hadith_en": "On the authority of Ibn Abbas (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: Were people to be given everything that they claimed, men would [unjustly] claim the wealth and lives of [other] people. But, the onus of proof is upon the claimant, and the taking of an oath is upon him who denies. A hasan hadeeth narrated by al-Baihaqee and others in this form, and part of it is in the two Saheehs", "hadith_ar": "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \"لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، لَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ الْبَيْهَقِيّ [في\"السنن\" 10/252]، وَغَيْرُهُ هَكَذَا، وَبَعْضُهُ فِي \"الصَّحِيحَيْنِ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 34, "title_tr": "KÖTÜLÜĞÜ GİDERMEK İSLÂMİ BİR GÖREVDİR", "title_en": "Enjoining Good and Forbidding Evil", "title_ar": "الحديث الرابع والثلاثون", "hadith_tr": "Ebu Saîd el-Hudrî (radiyallahu anh) anlatıyor: Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu duydum: “Sizden kim, bir kötülük görürse onu eliyle değiştirsin. Eliyle değiştirmeye gücü yetmezse, diliyle değiştirsin. Buna da gücü yetmezse kalbiyle değiştirsin. Sonuncusu, imanın en zayıf hâlidir.”", "hadith_en": "On the authority of Abu Sa`eed al-Khudree (may Allah be pleased with him) who said: I heard the Messenger of Allah (ﷺ) say, “Whosoever of you sees an evil, let him change it with his hand; and if he is not able to do so, then [let him change it] with his tongue; and if he is not able to do so, then with his heart — and that is the weakest of faith.” [Muslim]", "hadith_ar": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيّ رَضِيَ اللهُ عَنْهُ قَالَ سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الْإِيمَانِ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 35, "title_tr": "İSLÂM KARDEŞLİĞİ VE MÜSLÜMANIN HAKLARI", "title_en": "Brotherhood in Islam", "title_ar": "الحديث الخامس والثلاثون", "hadith_tr": "Ebu Hureyre (radiyallahu anh), Resulullah’ın (sallallahu aleyhi ve sellem) şöyle buyurduğunu rivayet etti: “Birbirinize haset etmeyin. Alış verişte, almayacağınız malın fiyatını arttırarak birbirinizi aldatmayın. Birbirinize kin gütmeyin. Birbirinize sırt çevirmeyin (küsüp darılmayın). Pazarlığı bitmiş olan alışverişi bozmayın. Allah’ın kulları! Kardeş olun. Müslüman, Müslümanın kardeşidir. Ona zulmetmez, darda kaldığında onu yalnız bırakmaz, yalan söylemez. Onu küçük görmez. Resulullah göğsünü göstererek üç defa, takva (Allah korkusu) buradadır. Kişiye, mü’min kardeşini hor görmesi, günah olarak yeter. Müslüman’ın her şeyi: kanı, malı ve namusu diğer Müslümana haramdır.”", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Do not envy one another, and do not inflate prices for one another, and do not hate one another, and do not turn away from one another, and do not undercut one another in trade, but [rather] be slaves of Allah and brothers [amongst yourselves]. A Muslim is the brother of a Muslim: he does not oppress him, nor does he fail him, nor does he lie to him, nor does he hold him in contempt. Taqwa (piety) is right here [and he pointed to his chest three times]. It is evil enough for a man to hold his brother Muslim in contempt. The whole of a Muslim is inviolable for another Muslim: his blood, his property, and his honour.” [Muslim]", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إخْوَانًا، الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَكْذِبُهُ، وَلَا يَحْقِرُهُ، التَّقْوَى هَاهُنَا، وَيُشِيرُ إلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ، بِحَسْبِ امْرِئٍ مِنْ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ، كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ . [رَوَاهُ مُسْلِمٌ]", "source_tr": "Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 36, "title_tr": "HAYIRLARIN TÜMÜ", "title_en": "Helping a Fellow Muslim", "title_ar": "الحديث السادس والعشرون", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, Peygamber (sallallahu aleyhi ve sellem) şöyle buyurdu: “Kim, bir mü’minin dünya üzüntülerinden birini giderirse, Allah da onun kıyamet günündeki üzüntülerinden birini giderir. Kim, darda kalmışa kolaylık gösterirse, Allah da, dünya ve ahirette ona kolaylık gösterir. Kul, kardeşine yardım ettiği sürece, Allah da ona yardım eder. Kim, ilim tahsil etmek için yola çıkarsa, o ilim sebebiyle, Allah o kimseye, cennete giden yolu kolaylaştırır. Bir topluluk, Allah’ın evlerinden birinde, Allah’ın kitabını okuyarak, aralarında müzâkere etmek üzere toplanırsa, onların üzerine sekînet ve huzur iner, onları rahmet bürür ve melekler onları kuşatır. Yüce Allah yanındakilere onları zikreder. Bir kimseyi ameli geri bırakırsa, nesebi ileri götüremez.” 1 Buharî ve Müslim", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him), that the Prophet (peace and blessings of Allah be upon him) said: Whoever removes a worldly grief from a believer, Allah will remove from him one of the griefs of the Day of Resurrection. And whoever alleviates the need of a needy person, Allah will alleviate his needs in this world and the Hereafter. Whoever shields [or hides the misdeeds of] a Muslim, Allah will shield him in this world and the Hereafter. And Allah will aid His slave so long as he aids his brother. And whoever follows a path to seek knowledge therein, Allah will make easy for him a path to Paradise. No people gather together in one of the Houses of Allah, reciting the Book of Allah and studying it among themselves, except that sakeenah (tranquility) descends upon them, and mercy envelops them, and the angels surround them, and Allah mentions them amongst those who are with Him. And whoever is slowed down by his actions, will not be hastened forward by his lineage. Related by [Muslim] in these words", "hadith_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ، يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِما سَتَرَهُ اللهُ فِي الدُّنْيَا وَالْآخِرَةِ ، وَاَللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ، وَيَتَدَارَسُونَهُ فِيمَا بَيْنَهُمْ؛ إلَّا نَزَلَتْ عَلَيْهِمْ السَّكِينَةُ، وَغَشِيَتْهُمْ الرَّحْمَةُ، وَ حَفَّتهُمُ المَلاَئِكَة، وَذَكَرَهُمْ اللَّهُ فِيمَنْ عِنْدَهُ، وَمَنْ أَبَطْأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ . [رَوَاهُ مُسْلِمٌ] بهذا اللفظ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 37, "title_tr": "ALLAH’IN ADALETİ, LÜTFU VE GÜCÜ", "title_en": "Allah's Justice and Grace", "title_ar": "الحديث السابع والثلاثون", "hadith_tr": "İbn Abbas (radiyallahu anh), Resulullah (sallallahu aleyhi ve sellem) Rabbinden yaptığı rivayette şöyle buyurduğunu söylemektedir: “Allah iyilikleri ve kötülükleri yazıp şunları açıkladı: Kim bir iyiliği yapmaya karar verir de yapmazsa, Allah onu kendi yanında tam bir iyilik olarak yazar. Bir iyiliği yapmaya karar verir ve yaparsa, onu on sevaptan yedi yüz katına, hatta daha çok katlarına kadar sevap olarak yazar. Kim bir kötülük yapmaya niyet eder, sonra vazgeçerse, onu da tam bir iyilik olarak yazar. Eğer bir kötülüğü yapmaya karar verir ve yaparsa, onu bir günah olarak yazar.” 1 Buharî ve Müslim", "hadith_en": "On the authority of Ibn Abbas (may Allah be pleased with him), from the Messenger of Allah (peace and blessings of Allah be upon him), from what he has related from his Lord: Verily Allah ta’ala has written down the good deeds and the evil deeds, and then explained it [by saying]: “Whosoever intended to perform a good deed, but did not do it, then Allah writes it down with Himself as a complete good deed. And if he intended to perform it and then did perform it, then Allah writes it down with Himself as from ten good deeds up to seven hundred times, up to many times multiplied. And if he intended to perform an evil deed, but did not do it, then Allah writes it down with Himself as a complete good deed. And if he intended it [i.e., the evil deed] and then performed it, then Allah writes it down as one evil deed.” [Al-Bukhari] [Muslim]", "hadith_ar": "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، قَالَ: \"إنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إلَى سَبْعِمِائَةِ ضِعْفٍ إلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً\".<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]، في \"صحيحيهما\" بهذه الحروف", "source_tr": "Buhari ve Müslim", "source_en": "Muslim", "source_ar": "Muslim"}, {"id": 38, "title_tr": "ALLAH’A YAKIN OLMA VE ONUN SEVGİSİNİ KAZANMA", "title_en": "Attaining Nearness to Allah", "title_ar": "الحديث الثامن والثلاثون", "hadith_tr": "Ebu Hureyre’nin (radiyallahu anh) rivayet ettiğine göre, Peygamber (sallallahu aleyhi ve sellem) şöyle buyurmuştur: “Yüce Allah şunları buyurdu: Kim, benim bir veli kuluma düşmanlık ederse, ben ona savaş ilân ederim. Kulum, farz kıldığımdan daha fazla sevdiğim bir şeyle bana yaklaşamaz. Kulum bana, devamlı olarak nafile ibadetlerle de yaklaşır. Böylece ben onu severim. Onu seversem, işiten kulağı, gören gözü, tutan eli, yürüyen ayağı olurum. İsterse mutlaka veririm. Bana sığınırsa onu korurum.” 1 Buharî", "hadith_en": "On the authority of Abu Hurayrah (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “Verily Allah ta’ala has said: ‘Whosoever shows enmity to a wali (friend) of Mine, then I have declared war against him. And My servant does not draw near to Me with anything more loved to Me than the religious duties I have obligated upon him. And My servant continues to draw near to me with nafil (supererogatory) deeds until I Love him. When I Love him, I am his hearing with which he hears, and his sight with which he sees, and his hand with which he strikes, and his foot with which he walks. Were he to ask [something] of Me, I would surely give it to him; and were he to seek refuge with Me, I would surely grant him refuge.’ ” [Al-Bukhari]", "hadith_ar": "عَنْ أَبِي هُرَيْرَة رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُول اللَّهِ صلى الله عليه و سلم إنَّ اللَّهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقْد آذَنْتهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إلَيَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلَا يَزَالُ عَبْدِي يَتَقَرَّبُ إلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْت سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَلَئِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنْ اسْتَعَاذَنِي لَأُعِيذَنَّهُ . [رَوَاهُ الْبُخَارِيُّ]", "source_tr": "Buhari ve Müslim", "source_en": "Al-Bukhari", "source_ar": "Al-Bukhari"}, {"id": 39, "title_tr": "İSLAM’DA ZORLUĞUN KALDIRILMASI", "title_en": "Lifting of Hardship", "title_ar": "الحديث التاسع والثلاثون", "hadith_tr": "İbn Abbas’ın (radiyallahu anh) rivayet ettiğine göre, Resulullah (sallallahu aleyhi ve sellem) şöyle buyurdu: “Yüce Allah ümmetimden benim için, hata, unutma ve zorlanarak yaptırılan bir işten dolayı meydana gelecek günahları kaldırmıştır.” 1 İbn Mâce, el-Beyhâki ve İbn Hibban, Sahih", "hadith_en": "On the authority of Ibn Abbas (may Allah be pleased with him), that the Messenger of Allah (peace and blessings of Allah be upon him) said: Verily Allah has pardoned [or been lenient with] for me my ummah: their mistakes, their forgetfulness, and that which they have been forced to do under duress. A hasan hadeeth related by Ibn Majah, and al-Bayhaqee and others", "hadith_ar": "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \"إنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ ابْنُ مَاجَهْ [رقم:2045]، وَالْبَيْهَقِيّ [\"السنن]", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 40, "title_tr": "AHİRETİ KAZANMAK İÇİN DÜNYAYI FIRSAT BİLMEK", "title_en": "The World is a Journey", "title_ar": "الحديث الأربعون", "hadith_tr": "İbn Ömer (radiyallahu anh) şöyle anlattı: Rasûlullah (sallallahu aleyhi ve sellem) omzumdan tutup şöyle dedi: “Dünyada garip bir kimse gibi veya geçip giden bir yolcu gibi ol.” İbn Ömer de (radiyallahu anh) şöyle diyordu: “Akşamı ettiğinde sabahı bekleme; sabaha ulaşınca da akşamı bekleme. Sağlıklıyken, hastalığın içi; hayatında da ölümden sonrasına hazırlık yap.”", "hadith_en": "On the authority of Abdullah ibn Umar (may Allah be pleased with him), who said: The Messenger of Allah (peace and blessings of Allah be upon him) took me by the shoulder and said, “Be in this world as though you were a stranger or a wayfarer.” And Ibn Umar (may Allah be pleased with him) used to say, “In the evening do not expect [to live until] the morning, and in the morning do not expect [to live until] the evening. Take [advantage of] your health before times of sickness, and [take advantage of] your life before your death.” [Al-Bukhari]", "hadith_ar": "عَنْ ابْن عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: أَخَذَ رَسُولُ اللَّهِ صلى الله عليه و سلم بِمَنْكِبِي، وَقَالَ: كُنْ فِي الدُّنْيَا كَأَنَّك غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ . وَكَانَ ابْنُ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا يَقُولُ: إذَا أَمْسَيْتَ فَلَا تَنْتَظِرْ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلَا تَنْتَظِرْ الْمَسَاءَ، وَخُذْ مِنْ صِحَّتِك لِمَرَضِك، وَمِنْ حَيَاتِك لِمَوْتِك. [رَوَاهُ الْبُخَارِيُّ]", "source_tr": "Buhari", "source_en": "Al-Bukhari", "source_ar": "Al-Bukhari"}, {"id": 41, "title_tr": "ALLAH’IN DİNİNE UYMAK İMANIN TEMELİDİR", "title_en": "Submitting to the Revelation", "title_ar": "الحديث الحادي والأربعون", "hadith_tr": "Ebu Muhammed Abdullah b. Amr b. el-As (radiyallahu anh), Resulullah’ın şöyle buyurduğunu rivayet etti: “Sizden birinin gönlü (hevası) benim getirdiğim dine tâbi oluncaya kadar hakkıyla iman etmiş olmaz.” 1 Bu, hasen sahih bir hadistir. Onu, Kitabu’l-Hucce’de sahih birisnatile rivayet edilmiştir.", "hadith_en": "On the authority of Abu Muhammad Abdullah bin ’Amr bin al-’Aas (may Allah be pleased with him) who said: The Messenger of Allah (peace and blessings of Allah be upon him) said, “None of you [truly] believes until his desires are subservient to that which I have brought.” [Imam an-Nawawi says:] We have related it in Kitab al-Hujjah with a saheeh chain of narrators", "hadith_ar": "عَنْ أَبِي مُحَمَّدٍ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم \"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ\". حَدِيثٌ حَسَنٌ صَحِيحٌ، رَوَيْنَاهُ فِي كِتَابِ \"الْحُجَّةِ\" بِإِسْنَادٍ صَحِيحٍ", "source_tr": "Buhari ve Müslim", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}, {"id": 42, "title_tr": "İLAHİ MAĞFİRETİN ŞİFRESİ: TÖVBE", "title_en": "The Vastness of Allah's Forgiveness", "title_ar": "الحديث الثاني والأربعون", "hadith_tr": "Enes bin Malik (radiyallahu anh) Resulullah’ın (sallallahu aleyhi ve sellem) Rabbinden (celle celaluhu) şunları bildirdiğini rivayet eder: Ey Âdemoğlu! İşlediğin bütün günahlara rağmen, bana dua edip bağışlanmayı istediğin müddetçe, günahlarına bakmayıp seni bağışlarım. Ey Âdemoğlu! Günahların gökyüzündeki bulutlara kadar ulaşsa, sonra benden af dilesen, seni affederim. Ey Âdemoğlu! Sen bana hiçbir surette şirk koşmadığın sürece, yeryüzü dolusu günah ile de gelsen ben yine de seni bağışlarım ve sana yeryüzü dolusu mağfiretle gelirim. (Günahlarına mağfiretle karşılık veririm.) 1", "hadith_en": "On the authority of Anas (may Allah be pleased with him) who said: I heard the Messenger of Allah (peace and blessings of Allah be upon him) say, “Allah the Almighty has said: ‘O Son of Adam, as long as you invoke Me and ask of Me, I shall forgive you for what you have done, and I shall not mind. O Son of Adam, were your sins to reach the clouds of the sky and you then asked forgiveness from Me, I would forgive you. O Son of Adam, were you to come to Me with sins nearly as great as the Earth, and were you then to face Me, ascribing no partner to Me, I would bring you forgiveness nearly as great as it [too].’ ” It was related by at-Tirmidhi, who said that it was a hasan hadeeth", "hadith_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: قَالَ اللَّهُ تَعَالَى: يَا ابْنَ آدَمَ! إِنَّكَ مَا دَعَوْتنِي وَرَجَوْتنِي غَفَرْتُ لَك عَلَى مَا كَانَ مِنْك وَلَا أُبَالِي، يَا ابْنَ آدَمَ! لَوْ بَلَغَتْ ذُنُوبُك عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتنِي غَفَرْتُ لَك، يَا ابْنَ آدَمَ! إنَّك لَوْ أتَيْتنِي بِقُرَابِ الْأَرْضِ خَطَايَا ثُمَّ لَقِيتنِي لَا تُشْرِكُ بِي شَيْئًا لَأَتَيْتُك بِقُرَابِهَا مَغْفِرَةً . رَوَاهُ التِّرْمِذِيُّ [رقم:3540]، وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ", "source_tr": "Tirmizi Hasen ve Sahih kaydıyla… İLİM AHLAK HAREKET", "source_en": "Bukhari & Muslim", "source_ar": "Bukhari & Muslim"}];
        let currentLang = 'tr';

        function renderHadiths(filter = '') {
            const container = document.getElementById('hadithContainer');
            container.innerHTML = '';
            
            const filtered = hadiths.filter(h => {
                const searchStr = (
                    h.title_tr + ' ' + h.title_en + ' ' + h.title_ar + ' ' +
                    h.hadith_tr + ' ' + h.hadith_en + ' ' + h.hadith_ar + ' ' +
                    h.source_tr + ' ' + h.source_en + ' ' + h.source_ar
                ).toLowerCase();
                return searchStr.includes(filter.toLowerCase());
            });

            filtered.forEach(h => {
                const card = document.createElement('div');
                card.className = 'hadith-card';
                
                let title, text, source;
                if (currentLang === 'tr') {
                    title = h.title_tr;
                    text = h.hadith_tr;
                    source = h.source_tr;
                } else if (currentLang === 'en') {
                    title = h.title_en;
                    text = h.hadith_en;
                    source = h.source_en;
                } else {
                    title = h.title_ar;
                    text = h.hadith_ar;
                    source = h.source_ar;
                }

                card.innerHTML = `
                    <div class="hadith-id">HADITH #${h.id}</div>
                    <div class="hadith-title">${title}</div>
                    <div class="arabic">${h.hadith_ar}</div>
                    <div class="translation">${text}</div>
                    <div class="source">${source}</div>
                `;
                container.appendChild(card);
            });
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            renderHadiths(document.getElementById('searchInput').value);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderHadiths(e.target.value);
        });

        // Initial render
        renderHadiths();
    </script>
</body>
</html>
