<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takiyuddin - Esmaül Hüsna Gezgini</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #b07d3d;
            --accent-light: #d4a373;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --arabic-font: 'Traditional Arabic', 'Amiri', serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        h1 {
            color: var(--accent);
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
            font-weight: 800;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        #search {
            width: 100%;
            padding: 16px 24px;
            border-radius: 30px;
            border: 2px solid var(--accent);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 18px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            outline: none;
            transition: all 0.3s;
        }

        #search:focus {
            box-shadow: 0 0 20px rgba(176, 125, 61, 0.4);
            transform: scale(1.02);
        }

        .stats {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .names-grid {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .name-card {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .name-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .name-id {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            opacity: 0.5;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: 48px;
            color: white;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.2;
        }

        .transcription {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-light);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meaning {
            font-size: 16px;
            text-align: center;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .details {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .active .details {
            display: block;
        }

        .found {
            font-size: 11px;
            color: var(--accent);
            margin-top: 10px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Modal / Overlay style if we wanted, but cards are fine */
        
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .names-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Esmaül Hüsna</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem;">Allah'ın 99 İsmi ve Manaları</p>
</header>

<div class="search-container">
    <input type="text" id="search" placeholder="İsim, anlam veya açıklama ara...">
</div>

<div class="stats" id="stats">99 İSİMDEN 99 TANESİ</div>

<div class="names-grid" id="namesGrid">
    <div class="empty-state">Yükleniyor...</div>
</div>

<script>
    const esmaData = [{"id": 1, "name_ar": "الرَّحْمَنُ", "transcription_tr": "Er-Rahmân", "transcription_en": "Ar Rahmaan", "meaning_tr": "Rahmetiyle muamele eden, esirgeyen.", "meaning_en": "The Beneficent", "description_tr": "Er-Rahmân Rahmet ve merhamet; acıma, bağışlama, kalp yufkalığı, şefkat ve ihsân anlamlarına gelir. “Rahmân” ve “Rahîm” isimleri, “çok şefkat ve merhamet eden” anlamındadır. Kur’ân’da “Rahmân” ismi elli yedi, “Rahîm” ismi yüz on beş defa Allah’a nisbet edilmektedir. “Rahmân”, Allah’ın zâtî ismi, “Rahîm” ise fiilî isimlerindendir. “Rahmân”, zâtî ismi olduğundan Allah’tan başkasına isim olarak verilemez. Fiilî isimlerinden olan “Rahîm” ise başkasına isim olarak verilebilir. Allah’ın bu ismi bir kulda tecelli ederse, o kul merhamet kanatlarını bütün yaratıklara açar. Allah’ın rahmeti bütün yaratılmışları kapsar. Rahmetiyle, inanan inanmayan bütün insanlara rızıklarını ve nimetlerini bol bol vermektedir.Hz. Peygamber Allah’ın rahmetini şöyle anlatır: “Şüphesiz Allah’ın yüz rahmeti vardır. Bunlardan bir tanesini yaratıklarına vermiştir. Yaratıkların birbirlerine acımaları bu rahmet sebebiyledir. Allah’ın rahmetinin doksan dokuzu kıyâmet günü içindir.”", "description_en": "He who wills goodness and mercy for all His creatures", "found": "(1:3) (17:110)"}, {"id": 2, "name_ar": "الرَّحِيمُ", "transcription_tr": "Er-Rahim", "transcription_en": "Ar Raheem", "meaning_tr": "Merhamet eden, bağışlayan.", "meaning_en": "The Merciful", "description_tr": "Er-Rahim Pek çok merhamet edici, verdiği nimetleri iyi kullananları daha büyük nimetler vermek suretiyle mükâfâtlandırıcı anlamındadır. Rahmân ve rahîm, rahmet kökünden türemiştir. İkisi de Allah’ın engin merhamet ve şefkatini bildirir. Ancak aralarında şöyle bir fark vardır: Rahmân ismi dünyada mü’min kâfir herkesi kuşatmışken, rahîm, sadece inananlara mahsustur. Bu bakımdan Allah, âhirette sadece mü’minlere rahmet ederek, onları cennetine koyacaktır. Rahmân ve rahîm isimleri iki türlü rahmet ifâde eder. Rahmân isminin ifâde ettiği rahmet, hiç bir şarta, kesbe ve irâdeye bağlı olmayarak bahşolunan rahmettir. Bu bütün yaratıkları kapsayan bir rahmettir. Bunda çalışan çalışmayan, itaatli suçlu, inançlı inançsız ayırımı yoktur. Rahîm isminin ifâde ettiği rahmet ise, Rahmân’ın lütfu olan rahmeti iyiye kullanarak çalışanlara bir mükâfât olmak üzere verilen rahmettir. Bu, en az bire ondur. Çalışanın samimiyetine göre yedi yüz katına ve hatta daha fazla katlara çıkabilir. Elbette çalışanla çalışmayan bir olmaz.", "description_en": "He who acts with extreme kindness ", "found": "(2:163) (3: 31) (4:100) (5:3)"}, {"id": 3, "name_ar": "الْمَلِكُ", "transcription_tr": "El-Melik", "transcription_en": "Al Malik", "meaning_tr": "Mülkün gerçek sahibi, mülk ve saltanatı devamlı olan.", "meaning_en": "The King / Eternal Lord", "description_tr": "El-Melik Görülen ve görülmeyen bütün âlemlerin, bütün kâinatın tek sahibi ve mutlak surette tek hükümdârı demektir. Kendisine ibâdet edilmeye yegâne lâyık olan O’dur. O’nun istediği olur, istemediği olmaz. O, bir şeyin olmasını isterse, sadece “ol” der, o da derhal olur. Olmasını istemediği hiçbir şey de asla varlık sahasına çıkamaz. Bütün evren, yaratılmış olan her şey, mükemmel bir düzen içerisinde işlemektedir. Asla bir başı boşluk ve düzensizlik yoktur. Bütün idâre tek bir yerden geliyor. O Allah, dünya ve âhiret hayatındaki her şeye gerçek anlamda ve kayıtsız şartsız hâkim ve mâlik olan ve dilediği gibi tasarrufta bulunandır.", "description_en": "The Sovereign Lord, The One with the complete Dominion, the One Whose Dominion is clear from imperfection ", "found": "(20:114)(23:116)(59:23)(62:1)"}, {"id": 4, "name_ar": "الْقُدُّوسُ", "transcription_tr": "El-Kuddûs", "transcription_en": "Al Quddus", "meaning_tr": "Her türlü eksiklik ve ayıplardan münezzeh olan.", "meaning_en": "The Purest", "description_tr": "El-Kuddûs Hatadan, gafletten, âcizlikten, her türlü eksiklikten uzak, bütün kemâl sıfatları üzerinde toplamış, bütün övgülerin üstünde olan demektir. Her türlü ayıptan, kusurdan ve ihtiyaçtan uzak olan, her türlü hayır ve bereketin kaynağı olan mübarek zât demektir. Her türlü eksiklikten, lekeden, pastan, kirden son derece temiz demektir. Gördüğümüz görmediğimiz, bildiğimiz bilmediğimiz her şeyi yaratan Allah Teâlâ, kâinâtı akıllara durgunluk verecek bir düzen ile yaratmıştır.", "description_en": "The One who is pure from any imperfection and clear from children and adversaries", "found": "(59:23) (62:1)"}, {"id": 5, "name_ar": "السَّلاَمُ", "transcription_tr": "Es-Selâm", "transcription_en": "As Salaam", "meaning_tr": "Kullarını selâmete çıkaran.", "meaning_en": "The Source of Peace", "description_tr": "Es-Selâm Her türlü eksiklikten, ayıptan, kusurdan, yaratılmışlara özgü değişim ve yok oluştan münezzeh ve sâlim olan; kullarını her türlü kötülüklerden, tehlikelerden selâmete çıkaran; Cennetteki kullarına selam veren demektir. Allah, gerek dünyada, gerekse âhirette tehlikeye düşen kullarını tehlikelerden kurtarıp selamete çıkarandır. Hz. Peygamber, her namazdan sonra; “Allah’ım! Sen’sin selâm ve Sen’dendir selâm!” buyurmuştur. Selâm, Esmâ-i Hüsnâ’dan biri olduğu için Müslüman olmayanlara bu lafızla selam verilmez. Müslüman olmayanlar, dua ve esenlik dileği olan “selâm”ı hak etmemişlerdir.", "description_en": "The one who provides peace, calm and serenity. By citing this name, we declare peace for ourselves and for those around us.", "found": "(59:23)"}, {"id": 6, "name_ar": "الْمُؤْمِنُ", "transcription_tr": "El-Mü'min", "transcription_en": "Al Mu'min", "meaning_tr": "Gönüllerde iman ışığı uyandıran.", "meaning_en": "The inspirer of faith", "description_tr": "El-Mü’min Güven veren, va’dine güvenilen; inananları korku ve endişeden güvende kılan; mü’minlerin îmân ve samimiyetini tasdik eden; mûcizeler vermek suretiyle Peygamberlerinin doğruluğunu isbatlayan; kendisine sığınanları koruyan, emniyetle rahatlandıran demektir.Allah’ın kullarına en büyük nimetlerinden biri, îmândır. Diğeri, emniyettir. İnsan; canı, malı, ırzı, namusu için her zaman bir endişe ve korku içinde kalsaydı, bu ne büyük bir azap olurdu. Bu isim bir kulda tecellî edince, o kulun kalbine imân iyice yerleşir. O, güvenilir biri olur. Allah Teâlâ, mü’min isminin bir tecellisi olarak inananları korkulardan güvende kılıyor.", "description_en": "This name is mysterious even for Muslims because \\\"Al-Mu'min\\\" comes from the name \\\"Al-iman\\\" which means to believe, from where comes the name \\\"Al-Mu'minoune\\\" which means believers, it is is the name of the Koran for people who believe in 6 things: the oneness of God, the existence of angels, holy books (Torah, Gospel and Psalms (Zabor) unmodified and the Koran), the prophets, the last day (the day of judgment) and fate its evil and its good. The exact meaning of this name is very difficult to pin down in its original meaning but can be understood from a deeper and more mystical point of view.", "found": "(59:23)"}, {"id": 7, "name_ar": "الْمُهَيْمِنُ", "transcription_tr": "El-Müheymin", "transcription_en": "Al Muhaymin", "meaning_tr": "Gözeten ve koruyan.", "meaning_en": "The Guardian", "description_tr": "El-Müheymin Kâinatın bütün işlerini gözetleyip yöneten; bütün yaratıklarını gözetip koruyan; korkulardan emin kılan demektir. Yine kullarına asla zulmetmeyen; her söylediği ve yaptığına güvenilen; bütün kullarını hükmü altına alan; olup biten her şeyden haberdâr olan ve Peygamberi’ne indirdiği vahyin doğruluğuna tanıklık eden; kullarını dâimâ gözetim altında bulunduran; mü’minlere güven, sevgi ve huzur veren demektir.", "description_en": "Whoever dominates His creation and by His omnipotence in all aspects, no state or aspect in this world or the other escapes His will.", "found": "(59:23)"}, {"id": 8, "name_ar": "الْعَزِيزُ", "transcription_tr": "El-Aziz", "transcription_en": "Al Azeez", "meaning_tr": "Mağlup edilmesi asla mümkün olmayan.", "meaning_en": "The Precious / The Most Mighty", "description_tr": "Yenilmesi mümkün olmayan gâlip; dengi ve benzeri bulunmayacak şekilde değerli ve şerefli; güçlü ve yenilmez demektir. Allah Teâlâ yegâne güç ve kuvvet sahibi olan mutlak gâliptir. O’nu âciz bırakacak hiç bir güç yoktur. Dilediğini izzetli, şerefli ve üstün kılar.", "description_en": "The Glorious by His supremacy and His greatness, El-Aziz means in a sense the one who is dear and precious in the eyes of His creatures. He is not the servant of any creature, and no creature dictates to him what to do.", "found": "(3:6)(4:15 8)(9:40)(4 8:7)"}, {"id": 9, "name_ar": "الْجَبَّارُ", "transcription_tr": "El-Cebbâr", "transcription_en": "Al Jabbaar", "meaning_tr": "İstediğini mutlak yapan, dilediğine muktedir olan.", "meaning_en": "The Compeller", "description_tr": "El-Cebbâr Dilediğini her durumda gerçekleştiren; istediğini zorla yaptırmaya muktedir olan; yaratılmışların halini iyileştiren; parçalanmış, dağılmış ve bozulmuş olanı düzeltip onaran; her şeyi tasarrufu altına alan demektir. Allah Teâlâ, kırılanları onarır, eksikleri tamamlar, her türlü perişanlıkları düzeltir, yoluna koyar. Düzeni bozulan her şeyi düzene koyar. Yaratıklarının ihtiyaçlarını giderir. Yaşama ve rızık sebeplerini sağlar. Kırılan ümitlerin canlanması, şaşırtıcı perişanlıkların iyi hale gelmesi ve yola konması için tek başvuru kaynağının Allah Teâlâ olduğunu bilmeli, yanlış yerlere başvurmamalıdır.", "description_en": "The grandiose, the ultimate powerful by His greatness and His unlimited strength. When He destroys the oppressors (unjust and sinners) He applies His sentence with righteousness.", "found": "(59:23)"}, {"id": 10, "name_ar": "الْمُتَكَبِّرُ", "transcription_tr": "El-Mütekebbir", "transcription_en": "Al Mutakabbir", "meaning_tr": "Her şeyde büyüklüğünü gösteren.", "meaning_en": "The Greatest", "description_tr": "El-Mütekebbir Her zaman ve her yerde büyüklüğünü gösteren; zât ve sıfatlarının mâhiyeti bilinemeyecek kadar ulu, yaratılmışların sıfatlarından yüce olan; azgın ve zâlim insanları mutlak gücüne boyun eğmek zorunda bırakan demektir. Büyüklük ve yücelik, ancak Allah’a mahsustur. İnsan çalışıp çabalamalı büyük adam olmalı, ama asla büyüklenmemelidir. Yaratılmışlar içinde ilk defa kendini büyük gören İblis olmuş ve bu durum onun lanetlenmesine, cehenneme girmesine sebep olmuştur.", "description_en": "He who is superior to His creatures, no creature has the right to claim greatness.", "found": "(59:23)"}, {"id": 11, "name_ar": "الْخَالِقُ", "transcription_tr": "El-Hâlık", "transcription_en": "Al Khaaliq", "meaning_tr": "Her şeyi yoktan var eden.", "meaning_en": "The Creator", "description_tr": "El-Hâlık Her şeyi yaratan, yoktan var eden demektir. Allah Teâlâ, eşyayı, her hangi bir örneği ve benzeri olmadan yaratandır. Yarattığı her şeyi bütün ayrıntılarıyla bilir. Her şeyin varlığını, varlığı boyunca görüp geçireceği halleri bilir, olayları tayin ve tesbit eder, ona göre yaratır. Demek ki hâlık isminin iki anlamı vardır: birincisi; bir şeyin nasıl olacağını tayin ve tesbit etmek, ikincisi, o takdire uygun olarak o şeyi yaratmak, var etmek. Allah Teâlâ, her şeyi ezelde takdir etmiş, takdir ettiklerinin zamanı gelince bunları yaratmış, varlık sahasına çıkarmıştır. O’nun ilim, irâde, takdir ve yaratmasından hiç bir şey uzak kalamaz.", "description_en": "The Creator of all existences, living or dead, mobile or frozen.", "found": "(6:102)(13:16)(39:62)(40:62)(59:24)"}, {"id": 12, "name_ar": "الْبَارِئُ", "transcription_tr": "El-Bârî", "transcription_en": "Al Baari", "meaning_tr": "Her şeyi uygun bir tarzda ve birbirine uygun yaratan.", "meaning_en": "The Maker of Order", "description_tr": "El-Bârî Bir örneği ve maddesi olmaksızın yaratan; evrenin bütün parçalarını âhenkli ve düzenli olarak meydana getiren demektir. Allah Teâlâ, zât ve sıfatları bakımından yaratılmışlara asla benzemez. Yarattığı her şeyi hiç bir modele bağlı kalmaksızın yarattığı gibi, tam bir uygunluk ve kusursuzluk halinde yaratmıştır. Bir kulda bu isim tecellî edince, o kul yaptığı her şeyi adâletle, hakkâniyetle ve sağlam yapar.", "description_en": "He who lifts His creation above all faults or imperfections.", "found": "(59:24)"}, {"id": 13, "name_ar": "الْمُصَوِّرُ", "transcription_tr": "El-Musavvir", "transcription_en": "Al Musawwir", "meaning_tr": "Her şeye bir şekil ve hususiyet verip tasvir eden.", "meaning_en": "The Shaper of Beauty", "description_tr": "El-Musavvir Varlıkları çeşitli şekillerde yaratan; yarattığı her varlığa ayrı bir şekil ve husûsiyet veren demektir. Hâlik, bâri’ ve musavvir isimlerinin üçü de yaratıcı anlamındadır. Bunlardan hâlik; bir örneği, eşi, benzeri olmaksızın ilk defa yaratan demektir. Bâri’; yarattığı şeyi düzgün yaratan, yarattığı canlıları, organları yerli yerinde, uyumlu yaratan demektir. Musavvir de; yarattığı her şeye ayrı bir şekil, biçim ve husûsiyet veren demektir. Yeryüzünde bulunan milyarlarca insanın her bir organının bir diğerine benzemeyişi, Allah’ın yaratıcılığının mükemmelliğine delildir. Bu isimden nasip alan kullar, Allah’ın yarattığı her şeye hayranlıkla ve ibretle bakarlar.", "description_en": "The one who gives the look and the appearance to each creation from the inside as well as from the outside. In lost Arabic, literally, this word means sculptor and, in modern Arabic, literally means designer.", "found": "(59:24)"}, {"id": 14, "name_ar": "الْغَفَّارُ", "transcription_tr": "El-Gaffâr", "transcription_en": "Al Ghaffaar", "meaning_tr": "Kullarının günahlarını örten, günahlarını bağışlayan.", "meaning_en": "The Forgiving", "description_tr": "El-Gaffâr Dâimâ affeden; kullarının günahlarını örten, ayıp ve kusurlarını bağışlayan; tekrarlanan günahları bağışlayan; mağfireti, bağışlaması sonsuz olan demektir. Mânevî kirlerden, günahlardan temizlenmek için Allah Teâlâ’ya istiğfar etmeli, mağfiret ve bağışlanma dilemeliyiz.", "description_en": "Is the One who forgives what He wants to whom He wants.", "found": "(20:82)(38:66)(39:5)(40:42)(71:10)"}, {"id": 15, "name_ar": "الْقَهَّارُ", "transcription_tr": "El-Kahhâr", "transcription_en": "Al Qahhaar", "meaning_tr": "Her şeye, her istediğini yapacak surette galip ve hakim olan.", "meaning_en": "The Subduer", "description_tr": "El-Kahhâr Yenilmeyen, yegane gâlip demektir. Allah Teâlâ, her şeye, her istediğini yapacak şekilde gâlip ve hâkimdir. Kuvvet ve kudretiyle her şeyi içinden ve dışından kuşatmıştır. O’na karşı her şeyin boynu büküktür. Dilediğini istediği anda yok ve helak eder.", "description_en": "Is the One who is almighty to submit all creation to His will.", "found": "(13:16)(14:48)(38:65)(39:4)(40:16)"}, {"id": 16, "name_ar": "الْوَهَّابُ", "transcription_tr": "El-Vehhâb", "transcription_en": "Al Wahhaab", "meaning_tr": "Çok fazla ihsan eden.", "meaning_en": "The Giver of All", "description_tr": "El-Vehhâb Karşılık beklemeden bol bol veren; hibesi ve lütfu çok olan demektir. Allah Teâlâ, bağışı çok olandır, karşılıksız verendir, nimetlerinin ardı arkası kesilmeyendir. İnanan inanmayan ayırımı yapmaksızın bütün kullarına nimetlerini bol bol verendir. Rahmeti gereği lütfu bol olan ve hayırlı işlerde başarıya ulaştırandır.", "description_en": "Is the One who gives immensely without receiving anything in return", "found": "(3:8)(38:9)(38:35)"}, {"id": 17, "name_ar": "الرَّزَّاقُ", "transcription_tr": "Er-Rezzâk", "transcription_en": "Ar Razzaaq", "meaning_tr": "Bütün mahlukatın rızkını veren ve ihtiyacını karşılayan.", "meaning_en": "The Sustainer", "description_tr": "Er-Rezzâk Bedenlerin ve ruhların gıdasını, bütün yaratıklarının rızkını yaratıp veren demektir. Allah Teâlâ, yarattığı bütün yaratıklarının rızkına kefildir. Yerde, gökte, yer altında, denizde vb. nerede canlı varsa hepsinin rızkını yaratan Allah Teâlâ’dır. Hepsinin rızkını tam vaktinde ve unutmadan verir. Ancak insanlara, yarattığı rızıkları meşrû yoldan arayıp bulmalarını emretmiştir. Bu isimden nasip alan kul, rızkın değil, Rezzâk’ın peşinden koşar. Her nimette O’nu hatırlar. Allah’ın cömertliğine hayran kalır.", "description_en": "Is the One who makes distribute to every creature what it needs.", "found": "(51:58)"}, {"id": 18, "name_ar": "الْفَتَّاحُ", "transcription_tr": "El-Fettâh", "transcription_en": "Al Fattaah", "meaning_tr": "Her türlü zorlukları kolaylaştıran, darlıktan kurtaran.", "meaning_en": "The Opener", "description_tr": "El-Fettâh İyilik kapılarını açan; hakemlik yapan; bütün anlaşmazlıklarda hakemlik yaparak mutlak adâleti gerçekleştiren; zulme uğrayanlara yardım eden; mü’min kullarını zafere ulaştıran; mü’minlere mânevî kapıları açıp kalplerden kederleri gideren; her derde çare bulan; her türlü engelleri kaldıran demektir. Allah Teâlâ, yürekten, tasaları, kederleri giderendir. İnsanı sıkıntılardan kurtarıp göğsüne genişlik verendir. Anlaşılması zor ilimlerin üzerindeki zorluğu gidererek anlaşılmasını kolaylaştırandır. Allah, insana hidâyet yollarını açar.", "description_en": "Is He Who alone knows the keys to the future and the unknown, by His knowledge and by His wisdom. This name is often associated with the following name \"Al-‘Alīm\".", "found": "(34:26)"}, {"id": 19, "name_ar": "اَلْعَلِيْمُ", "transcription_tr": "El-Alîm", "transcription_en": "Al 'Aleem", "meaning_tr": "Her şeyi en ince noktasına kadar bilen, ilmi ebedi ve ezeli olan.", "meaning_en": "The Knower of all", "description_tr": "El-Alîm Hakkıyla bilen demektir. Allah Teâlâ, zaman ve yer kaydı olmaksızın büyük küçük, gizli açık her şeyi bilendir. Olmuşu, olanı, olacağı en mükemmel bir şekilde bilir. Hiç bir şey O’nun bilgisi dışına çıkamaz. O’nun bilemeyeceği bir şey düşünmek mümkün değildir.", "description_en": "The one from whom nothing can hide, for He knows everything and is aware of everything.", "found": "(2:158)(3:92)(4:35)(24:41)(33:40)"}, {"id": 20, "name_ar": "الْقَابِضُ", "transcription_tr": "El-Kâbıd", "transcription_en": "Al Qaabid", "meaning_tr": "Dilediğine darlık veren, sıkan, daraltan.", "meaning_en": "The Constrictor", "description_tr": "El-Kâbıd Rızkı daraltan; canlıların ruhlarını alıp hayatlarına son veren demektir. Allah Teâlâ, istediğini sıkar, daraltır; istediğini genişletir. İstediğinden verdiği zenginliği, çoluk çocuğu, hayat zevkini, gönül ferahlığını alıverir. ihsânettiği şeyleri daraltır, azaltır. Güneşin doğmasıyla karanlığı giderir. Kuşlara gökyüzünde uçma imkânı verir, onları düşmekten korur. Bu ismi “Bâsıt” ismiyle beraber değerlendirmelidir.", "description_en": "Is the One who restricts His good according to wisdom.", "found": "(2:245)"}, {"id": 21, "name_ar": "الْبَاسِطُ", "transcription_tr": "El-Bâsıt", "transcription_en": "Al Baasit", "meaning_tr": "Dilediğine bolluk veren, açan, genişleten.", "meaning_en": "The Reliever", "description_tr": "El-Bâsıt Rızkı genişleten; ruhları bedenlerine dağıtan demektir. Allah Teâlâ, kulunu darlıktan çıkaran, sıkıntıdan kurtarandır. İlâhî imtihanın gerçekleşmesi için bazan sıkar, bazan genişletir. Bazan darlık, sıkıntı verir. Bazan bolluk, rahatlık, huzur verir. Bu ismi, “Kâbıd” ismiyle beraber değerlendirmelidir.", "description_en": "Is the One who frees, increases and multiplies his good according to wisdom.", "found": "(2:245)"}, {"id": 22, "name_ar": "الْخَافِضُ", "transcription_tr": "El-Hâfıd", "transcription_en": "Al Khaafid", "meaning_tr": "Yukarıdan aşağıya indiren, alçaltan.", "meaning_en": "The Abaser", "description_tr": "El-Hâfıd Alçaltan; zillete düşüren; yukarıdan aşağıya indiren demektir. Allah Teâlâ, kâfirleri, zâlimleri, zorbaları alçaltır; mü’minleri, dostlarını yükseltir. İstediği kulunu yukarıdan aşağıya atıverir. En yüksek mertebelerden en aşağı mertebelere indiriverir. Allah’ın düşürdüğünü hiç kimse yükseltemez, yükselttiğini de hiç kimse alçaltamaz. Bu ismi “Râfi’” ismiyle beraber değerlendirmelidir.", "description_en": "Is the One who destines the oppressors and the proud to demeanor and chastisement.", "found": "(95:5)"}, {"id": 23, "name_ar": "الرَّافِعُ", "transcription_tr": "Er-Râfî", "transcription_en": "Ar Raafi'", "meaning_tr": "Yukarı kaldıran, yükselten.", "meaning_en": "The Exalter", "description_tr": "Er-Râfî Yücelten, yükselten, yukarı kaldıran, şeref veren demektir. Allah Teâlâ, dilediği kuluna şeref bahşederek yükseltir, diğer kullarından üstün kılar. Dilediğini zengin kılar, şerefli kılar, saygıdeğer kılar. Dilediğine îmân bahşeder, sâlih ameller işlemesine ve cennetine girmesine imkân verir. Bu ismi, “Hâfid” ismiyle beraber değerlendirmelidir. Râfi’; dostlarının tâat ve amellerini kabul edip kendisine yaklaştıran, dünyada şerefli kılan demektir. Hâfid de; kendisine itâat etmeyenleri kendisinden uzaklaştıran, mertebelerini düşüren demektir.", "description_en": "The Breeder in the sense of raising, the one who elevates the honor, the status and the prestige of a being in this lower world and in the hereafter.", "found": "(58:11)(6:83)"}, {"id": 24, "name_ar": "الْمُعِزُّ", "transcription_tr": "El-Muiz", "transcription_en": "Al Mu'iz", "meaning_tr": "İzzet verip ağırlayan.", "meaning_en": "The Bestower of Honour", "description_tr": "El-Muiz Üstün kılan, izzet ve şeref veren; mülkü dilediğine veren demektir. Allah Teâlâ, kendisine inananları yükseltir, şereflendirir, başkalarına üstün kılar. Îmân ehli, Allah’ın azîz ve değerli kıldığı kimselerdir. “Muizz” ismini “Müzill” ismi ile beraber değerlendirmelidir.", "description_en": "One who offers honor and precious value.", "found": "(3:26)"}, {"id": 25, "name_ar": "المُذِلُّ", "transcription_tr": "El-Muzil", "transcription_en": "Al Mudhil", "meaning_tr": "Zillete düşüren, hor ve hakir eden.", "meaning_en": "The Humiliator", "description_tr": "El-Muzil Zillete düşüren, hor ve hakir kılan, rezil ve perişan eden, alçaltan demektir. Gönülleri dünya hırsı ile yanıp tutuşan kişiler, Allah’ın zelil kıldıklarıdır. Bunların şiarı dünya çıkarı için nefsini alçaltmaktır. Bunlar yarın Allah’ın huzuruna yüzleri kararmış olarak çıkacaklardır. “Müzill” ismini, “Muizz” ismi ile beraber değerlendirmelidir.", "description_en": "Is the One who can humiliate and devalue any valiant.", "found": "(3:26)"}, {"id": 26, "name_ar": "السَّمِيعُ", "transcription_tr": "Es-Semî", "transcription_en": "As Samee'", "meaning_tr": "Her şeyi işiten.", "meaning_en": "The Hearer of all", "description_tr": "Es-Semî Sonsuz işiten, her türlü kısıtlamadan yüce olarak gizli açık her şeyi işiten; işitilecek şeyler kendisine gizli kalmayan; dilek, dua ve yakarışları kabul eden demektir. Allah Teâlâ, ister açık, ister gizli bütün sesleri, fısıltıları işitir. Kendisine içinden hamd edenin hamdini işiterek onu mükâfâtlandırır. Dua edenlerin dualarını kabul eder. Allah’ın işitmesi kullarınki gibi kulak ve ses gibi bazı vasıtalarla değildir.", "description_en": "One who hears any noise or sound in His kingdom emanating from any creature and also One who listens to the invocations of His creatures to respond to their invocations.", "found": "(2:127)(2:256)(8:17)(49:1)"}, {"id": 27, "name_ar": "الْبَصِيرُ", "transcription_tr": "El-Basîr", "transcription_en": "Al Baseer", "meaning_tr": "Her şeyi gören.", "meaning_en": "The Seer of all", "description_tr": "El-Basîr Sonsuz görücü; her şeyi gören, bilen; kendisinden hiç bir şey saklanamayan demektir. Allah Teâlâ’nın görmesi de işitmesi ve diğer isim ve sıfatları gibi sonsuzdur. Her hangi bir organ ve vasıta ile değildir. Görme konusu olan her şeyi görür. Açıkta olanları gördüğü gibi gizli olanları da görür. Dışımızı gördüğü gibi içimizi de görür. O hâlde devamlı bir şekilde Rabbimiz tarafından görüldüğümüzü ve gözetlendiğimizi unutmamamız, buna göre söz ve davranışlarımıza dikkat etmemiz gerekir.", "description_en": "Is the One from whom nothing that exists or comes into existence can escape without the slightest use of an eye, instrument or organ.", "found": "(4:58)(17:1)(42:11)(42:27)"}, {"id": 28, "name_ar": "الْحَكَمُ", "transcription_tr": "El-Hakem", "transcription_en": "Al Hakam", "meaning_tr": "Her işte hikmet ve adaletle hükmeden.", "meaning_en": "The Judge", "description_tr": "El-Hakem Hükmeden, hakkı yerine getiren; hüküm yetkisi kendisine ait olan; son hükmü verecek olan demektir. Allah Teâlâ, hâkimdir. Her şeyin hükmünü O verir. Verdiği hükmü tamamiyle yerine getirir. O’nun hükmünü engelleyecek, bozacak, değiştirecek, geri bıraktıracak hiç kimse yoktur. Kıyâmet gününde Allah Teâlâ hükmünü verecek, adâlet tam olarak gerçekleşecek ve herkes hak ettiğinin karşılığını tam olarak alacaktır. Hiç kimseye en küçük bir haksızlık yapılmayacaktır.", "description_en": "He is the One who judges and decides between creatures here below and in the hereafter and He who ensures equity between the creatures and no one else will and will not be able to decide between them and judge them; and the Judgment in the hereafter will be perfectly just and appropriate.", "found": "(22:69)"}, {"id": 29, "name_ar": "الْعَدْلُ", "transcription_tr": "El-Adl", "transcription_en": "Al 'Adl", "meaning_tr": "Son derece adaletli olan.", "meaning_en": "The Just", "description_tr": "El-Adl Mutlak adâlet sahibi, çok adâletli, asla zulmetmeyen; her şeyi yerli yerine koyan demektir. Allah Teâlâ, çok adâletlidir. Hiç kimseye en küçük bir haksızlık yapmaz. Herkes neyi hak ettiyse, herkese hakkını tam olarak verir. Yaptığı her şey, akla, mantığa, hikmet ve maslahata uygundur. Bu isimden nasip alan kul, zulmün her çeşidinden kaçınır; kendi aleyhine bile olsa adâletten ayrılmaz.", "description_en": "Is the One who is free from all forms of injustice and / or oppression.", "found": "(6:115)"}, {"id": 30, "name_ar": "اللَّطِيفُ", "transcription_tr": "El-Latîf", "transcription_en": "Al Lateef", "meaning_tr": "İşlerin bütün inceliklerini bilen.", "meaning_en": "The Subtle One", "description_tr": "El-Latîf Yaratılmışların ihtiyaçlarını en ince ayrıntıya varıncaya kadar bilip sezilmez yollarla karşılayan; kullarına yumuşaklıkla, lütuf ve ihsânıyla muâmele eden demektir. Allah Teâlâ, kullarına iyilik ve merhamet edendir. Fiillerini yumuşaklıkla gerçekleştirendir. Sonsuz lütuf ve kerem sahibidir. Kendisine gizli olan hiç bir şey yoktur.", "description_en": "Is the One who grants his creatures His gentleness and His benevolence.", "found": "(6:103)(22:63)(31:16)(33:34)"}, {"id": 31, "name_ar": "الْخَبِيرُ", "transcription_tr": "El-Habîr", "transcription_en": "Al Khabeer", "meaning_tr": "Her şeyin iç yüzünden, gizli tarafından haberdar olan.", "meaning_en": "The All Aware", "description_tr": "El-Habîr Her şeyi bilen, her şeyin iç yüzünden, gizli taraflarından haberdâr olan demektir. Allah Teâlâ, yerde ve gökte, bütün evrende olan gizli açık her şeyden haberdârdır. O’nun bilemeyeceği bir şey düşünmek mümkün değildir. Bu bakımdan yaptığımız her şeyi Allah’ın bildiğini düşünerek yapmalıyız.", "description_en": "He is the One from whom cannot be hidden the reality of everything that exists, that is to say the truth of things; no detail escapes Him, neither the thing as a whole, nor each of its parts; and to claim to be able to hide things from the One who creates everything is a delusion and a disbelief.", "found": "(6:18)(17:30)(49:13)(59:18)"}, {"id": 32, "name_ar": "الْحَلِيمُ", "transcription_tr": "El-Halîm", "transcription_en": "Al Haleem", "meaning_tr": "Yumuşak davranan, hilmi çok olan.", "meaning_en": "The Forebearing", "description_tr": "El-Halîm Suçluların cezasını vermeye gücü yettiği hâlde cezalandırmayıp onlar hakkında yumuşak davranan, cezalarını geriye bırakan; acele ve kızgınlıkla muâmele etmeyen demektir. Allah Teâlâ, günahları yüzünden kullarına olan lütuf ve ihsânını esirgemez. İyi olsun kötü olsun bütün kullarını rızıklandırır; belâ ve âfetlerden korur. Acelecilikle ve kızgınlıkla davranmaz. Çok yumuşak davranır. Ceza vermekte acele etmez. Süre tanır, ama ihmal etmez.", "description_en": "Is the One whose patience towards the disbeliefs of sinners exceeds all imagination (it is possible that forgiveness will be granted to them).", "found": "(2:235)(17:44)(22:59)(35:41)"}, {"id": 33, "name_ar": "الْعَظِيمُ", "transcription_tr": "El-Azîm", "transcription_en": "Al 'Azeem", "meaning_tr": "Pek azametli ve büyük olan.", "meaning_en": "The Maginificent", "description_tr": "El-Azîm Büyük, yüce, ulu demektir. Allah Teâlâ, zât ve sıfatları bakımından en büyüktür. Mutlak ve ekmel büyüklük Allah’a mahsustur. O, hiç bir şekilde âciz bırakılmayacak olan Kâdir-i mutlaktır. Akıl, O’nun büyüklüğünü idrâkten âcizdir.", "description_en": "This name is difficult to translate because it includes several French words that do not share the same spiritual meaning, but it can be approached as follows: \"Al-Adhīm\" He who is Gigantic Majestic and Fantastically Grandiose far from any bodily or material imperfection", "found": "(2:255)(42:4)(56:96)"}, {"id": 34, "name_ar": "الْغَفُورُ", "transcription_tr": "El-Gafûr", "transcription_en": "Al Ghafoor", "meaning_tr": "Çok bağışlayan, magfireti çok olan.", "meaning_en": "The Great Forgiver", "description_tr": "El-Gafûr Günahları bağışlayan; affeden demektir. Allah Teâlâ, bağışlaması bol olandır. Kulun günahı ne kadar çok olursa olsun Allah Teâlâ, bunları meydana çıkarıp kulunu rezil ve rüsvay etmez, bunları örter ve gizler. Kulun, işlediği gü nahları ve suçları bağışlar. Sonsuz mağfiret edici ve bağışlayıcıdır. Bu isimden nasip alan kul, daima istiğfâra yönelir. Şahsına yapılan haksızlıkları bağışlar. Kin tutmaz.", "description_en": "Is the One who forgives immensely over and over again.", "found": "(2:173)(8:69)(16:110)(41:32)"}, {"id": 35, "name_ar": "الشَّكُورُ", "transcription_tr": "Eş-Şekûr", "transcription_en": "Ash Shakoor", "meaning_tr": "Kendi rızası için yapılan iyi işleri, ziyadesiyle mükafatlandıran.", "meaning_en": "The Rewarder of Thankfulness", "description_tr": "Eş-Şekûr Az iyiliğe çok mükâfât veren; kendi rızası için yapılan iyilikleri fazlasıyla mükâfâtlandıran demektir. Allah Teâlâ, kulların işlediği ibâdet ve iyilikleri fazlasıyla karşılayandır. Kul, Allah’ın verdiği nimetlere şükürle karşılık vermelidir. Kul şükrederse, Allah onun şükrünü karşılıksız bırakmaz, fazlasıyla mükâfâtlandırır.", "description_en": "Is the One who shows His gratitude for worshipers, however incredibly easy to perform.", "found": "(35:30)(35:34)(42:23)(64:17)"}, {"id": 36, "name_ar": "الْعَلِيُّ", "transcription_tr": "El-Aliyy", "transcription_en": "Al 'Aliyy", "meaning_tr": "Çok yüce. Pek yüksek olan.", "meaning_en": "The Highest", "description_tr": "El-Aliyy Pek yüce, pek yüksek demektir. Allah Teâlâ, insan tasavvurunun tahayyül edeceği her şeyden daha büyük, daha yüce ve daha yüksektir. İzzet, şeref ve hükümranlık bakımından O’ndan daha yüce bir varlık yoktur. O’nun yüksekliği cisimlerin sahip olduğu türden değildir. Yücelik ve üstünlük bakımındandır.", "description_en": "Is the One who is above all that He created perfectly and unimaginably.", "found": "(4:34)(31:30)(42:4)(42:51)"}, {"id": 37, "name_ar": "الْكَبِيرُ", "transcription_tr": "El-Kebîr", "transcription_en": "Al Kabeer", "meaning_tr": "Büyüklüğünde hudut olmayan.", "meaning_en": "The Greatest", "description_tr": "El-Kebîr Büyük ve ulu demektir. Allah Teâlâ, her hususta insanların kavrayamayacağı kadar ulu ve büyüktür. Zâtının ve sıfatlarının mâhiyeti bilinemeyecek kadar uludur. Mutlak büyüktür. Kudret ve hükümranlığı sınırsızdır. Hiç bir şeye muhtaç değildir. Yaratılmışlara benzemez. O’nun büyüklüğü, mekâna bağlı bir büyüklük değildir. O, bundan münezzehtir.", "description_en": "The Great: One who is greater than His creation, a greatness that only He knows.", "found": "(13:9)(22:62)(31:30)"}, {"id": 38, "name_ar": "الْحَفِيظُ", "transcription_tr": "El-Hafîz", "transcription_en": "Al Hafeez", "meaning_tr": "Yapılan işleri bütün tafsilatıyla, ayrıntılarıyla tutan.", "meaning_en": "The Preserver", "description_tr": "El-Hafîz Koruyup gözeten; kendisinden gizli hiç bir şey olmayan demektir. Allah Teâlâ, evrenin düzenini koruyup sürdürendir. Her şeyi eksiksiz kaydedip hesaba çekmek üzere koruyandır. İnsanların niyetlerini ve bütün sırlarını bilendir. İnsanların söz ve hareketlerini melekler aracılığıyla tesbit ve tescil ettirendir. Dostlarını kötülüklerden koruyandır.", "description_en": "Is the One who protects and preserves His good.", "found": "(11:57)(34:21)(42:6)"}, {"id": 39, "name_ar": "المُقيِت", "transcription_tr": "El-Mukît", "transcription_en": "Al Muqeet", "meaning_tr": "Yaratılmış her şeyin azığını veren.", "meaning_en": "The Sustainer", "description_tr": "El-Mukît Yaratılmışların her türlü gıdalarını yaratıp veren; her şeye gücü yeten ve koruyan demektir. Allah Teâlâ, bedenlerin ve ruhların gıdasını yaratıp verendir. Yarattığı bütün canlılara ne kadar ömür takdir etmişse ona göre rızıklarını da tayin ve takdir etmiştir. Herkesin rızkı bellidir. Herkes kendi rızkını yer, kimse kimsenin rızkını yemez.", "description_en": "this word is among the lost words of the ancient Arabic language; very difficult to translate even in modern Arabic}. It would mean: Is the One who leaves no detail when He judges, even the most trivial.", "found": "(4:85)"}, {"id": 40, "name_ar": "الْحسِيبُ", "transcription_tr": "El-Hasîb", "transcription_en": "Al Haseeb", "meaning_tr": "Herkesin hayatı boyunca yaptıklarının hesabını soran.", "meaning_en": "The Reckoner, The Sufficient", "description_tr": "El-Hasîb Kullarına yeten; onları hesaba çeken demektir. Allah Teâlâ, herkesin hayatı boyunca yapıp ettiklerinin bütün ayrıntılarıyla hesabını iyi bilendir. Bütün kullarını yaptıklarından dolayı veya yapmaları gerekenleri yapmadıklarından dolayı çok ayrıntılı bir şekilde hesaba çekecek ve herkesin hak ettiğini tam olarak verecektir.", "description_en": "He is the One who will count all the facts of His creatures without forgetting or error.", "found": "(4:6)(4:86)(33:39)"}, {"id": 41, "name_ar": "الْجَلِيلُ", "transcription_tr": "El-Celîl", "transcription_en": "Al Jaleel", "meaning_tr": "Azamet sahibi olan, ululuk sahibi olan.", "meaning_en": "The Majestic", "description_tr": "El-Celîl Azamet ve ululuk sahibi demektir. Allah Teâlâ, bütün sınırlama ve benzerlikleri aşan bir yüceliğe sahiptir. Değer ve mertebece en yüce olandır. Mü’minleri yücelten, amellerini kabul edip mükâfâtlarını artırandır. O, zât, sıfat ve fiilleri itibariyle en büyüktür. O’nun büyüklüğü hacim itibariyle değildir; şân, şeref ve yücelik itibariyledir.", "description_en": "Is the One who is perfectly exempt from being compared to His creatures or from being like Him.", "found": "(55:27)(39:14)(7:143)"}, {"id": 42, "name_ar": "الْكَرِيمُ", "transcription_tr": "El-Kerîm", "transcription_en": "Al Kareem", "meaning_tr": "Çok ikram edici. Keremi ve mağfireti bol olan.", "meaning_en": "The Most Generous, The Most Esteemed", "description_tr": "El-Kerîm İhsânı, in’âmı, lütfu, keremi bol olan, sonsuz cömert demektir. Allah Teâlâ, her türlü faziletin sahibidir. Hiç bir karşılık beklemeden verendir. Yardımı ve ikrâmı sonsuz ve sınırsızdır. Muktedirken, affedendir. Va’dini yerine getirendir. Kendisine sığınanı yüz üstü bırakmayandır. Az da olsa işlenen iyi ameli kabul eden, karşılığını fazlasıyla verendir. Bu isimden nasip alan kul, cimriliğin her çeşidinden kurtulur. Allah’ın kendisine verdiği nimetleri diğer kullarıyla paylaşmasını bilir. Şahsiyetini zedeleyecek her türlü rezillikten kurtulur.", "description_en": "Is the One who flooded His creation with His generosity.", "found": "(27:40)(82:6)"}, {"id": 43, "name_ar": "الرَّقِيبُ", "transcription_tr": "Er-Rakîb", "transcription_en": "Ar Raqeeb", "meaning_tr": "Bütün varlıklar üzerine gözcü olan.", "meaning_en": "The Watchful One", "description_tr": "Er-Rakîb Her şeyi gözetleyip denetleyen; kontrol eden demektir. Allah Teâlâ, yaratıklarından bir an bile gâfil değildir. Kim ne yaparsa onu görür ve bilir. Hiçbir şey Allah’tan gizli kalmaz. Bütün varlıklar üzerinde gözcüdür, gözetleyicidir. Bütün işler O’nun denetimi ve gözetimi altında meydana gelmektedir. O, bütün olan bitenlere şahittir. Herkese yaptığının karşılığını verir.", "description_en": "Is the One who observes and beholds all that He has created (and the actions of creatures are also creations).", "found": "(4:1)(5:117)"}, {"id": 44, "name_ar": "الْمُجِيبُ", "transcription_tr": "El-Mücîb", "transcription_en": "Al Mujeeb ", "meaning_tr": "Dua edenlerin dualarını kabul eden, isteklerini veren.", "meaning_en": "The Responder to Prayer", "description_tr": "El-Mücîb Kendine yalvaranların isteklerini veren; kullarının dileklerine ve dualarına karşılık veren demektir. Allah Teâlâ, kullarına, onlardan daha yakındır. Kendine yalvaranları işitir, bilir ve onların isteklerini verir. İnsanın duâya şiddetle ihtiyacı vardır. Duâ, bir bakıma ibâdettir. Duâdan mahrum kalmamak lazımdır.", "description_en": "Is the One who answers the invocations of His creatures if He wills and to whom He wills.", "found": "(11:61)"}, {"id": 45, "name_ar": "الْوَاسِعُ", "transcription_tr": "El-Vâsî", "transcription_en": "Al Waasi'", "meaning_tr": "Lütfu bol olan.", "meaning_en": "The All-Encompassing, the Boundless", "description_tr": "El-Vâsî İlmi ve merhameti her şeyi kuşatan demektir. Allah Teâlâ, kullarına bolca ihsân eden, rızıklarını genişletendir. Allah ilim, lütuf ve ihsânı ile her şeyi kuşatmıştır. Nimetlerinin bir kısmı fayda sağlayan türden, diğer bir kısmı da zararları gideren türdendir.", "description_en": "This name in Arabic means: immensely wide, but to qualify God it is understood that He has filled every void and has contained all things in a way that only He knows.", "found": "(2:268)(3:73)(5:54)"}, {"id": 46, "name_ar": "الْحَكِيمُ", "transcription_tr": "El-Hakîm", "transcription_en": "Al Hakeem", "meaning_tr": "Emirleri, kelamı ve bütün işleri hikmetli olan.", "meaning_en": "The Perfectly Wise", "description_tr": "El-Hakîm Hikmet sahibi demektir. Allah Teâlâ, yaptığı her şeyi yerli yerince, eksiksiz ve tam yapar. En üstün bir ilim sahibidir ve yaptığı her şey mutlaka bir hikmete mebnîdir; hikmetsiz asla iş yapmaz. Bütün emirleri insanların yararına olduğu gibi bütün yasakları da insanların zararınadır.", "description_en": "He whose Wisdom has dazzled, dazzled and will dazzle any conscious and intelligent mind.", "found": "(31:27)(46:2)(57:1)(66:2)"}, {"id": 47, "name_ar": "الْوَدُودُ", "transcription_tr": "El-Vedûd", "transcription_en": "Al Wudood", "meaning_tr": "İyi kullarını seven, sevilmeye ve dostluğa hakkıyla layık olan.", "meaning_en": "The Most Loving", "description_tr": "El-Vedûd Çok seven ve çok sevilen; sevilmeye lâyık olan demektir. Allah Teâlâ, sâlih kullarını sever, sâlih kulları da Allah’ı sever. Sâlih kullarından râzıdır. Allah yaratılmış bütün varlıkların hayrını ister. Bu nedenle onlara ihsân ve ikrâmlarda bulunur. Sevilmeye en çok lâyık olan da O’dur. Her mü’minin hedefi Allah dostluğunu kazanabilmek olmalıdır. Bunun için her türlü fedakârlığa katlanmalıdır. Bu isimden nasip alan kul, hem Allah adına herkesi, her şeyi sever; hem de herkes tarafından sevilir.", "description_en": "This word in Arabic means: The one who draws near to his beloved by mercy, pity and beneficence, but when one reads this name in the \"Koran\", one feels each time different meanings which are difficult to translate into words}. We can try to translate it: The one who draws near to His servants out of pity although they move away from Him and do not glorify Him.", "found": "(11:90)(85:14)"}, {"id": 48, "name_ar": "الْمَجِيدُ", "transcription_tr": "El-Mecîd", "transcription_en": "Al Majeed", "meaning_tr": "Şanı çok büyük ve çok yüksek olan.", "meaning_en": "The Glorious One, The Most Honorable", "description_tr": "El-Mecîd Şânı büyük, yüksek; lütuf ve ikrâmı bol demektir. Allah Teâlâ, her türlü eksikliklerden yücedir. Şânı büyüktür. Lütuf ve keremi çoktur. Her türlü övgüye lâyıktır. Affı, ihsânı, rahmeti ve yardımı sonsuzdur. Nimetleri saymakla bitmez.", "description_en": "Is the One who is glorified in the infinitely past, present and eternal.", "found": "(11:73) "}, {"id": 49, "name_ar": "الْبَاعِثُ", "transcription_tr": "El-Bâis", "transcription_en": "Al Baa'ith", "meaning_tr": "Ölüleri diriltip kabirlerinden çıkaran.", "meaning_en": "The Resurrector", "description_tr": "El-Bâis Ölüleri dirilten, Peygamber gönderen demektir. Allah Teâlâ, öldükten sonra diriltendir. İnsanlar ölüp toprak olduktan sonra onları diriltecek, kabirlerinden çıkaracak, mahşerde toplayacak, çok ayrıntılı bir şekilde hesaba çekecektir. Allah Teâlâ, aynı zamanda insanlara doğru yolu göstermek üzere Peygamberler gönderendir. Peygamberlere uyanlar kurtulacak, uymayanlar azâbı hak edeceklerdir.", "description_en": "Is the One who raises the dead and deploys life in whatever He wants, be they men, animals or simply earth.", "found": "(22:7)"}, {"id": 50, "name_ar": "الشَّهِيدُ", "transcription_tr": "Eş-Şehîd", "transcription_en": "Ash Shaheed", "meaning_tr": "Her zaman ve her yerde hazır ve nazır olan.", "meaning_en": "The Witness", "description_tr": "Eş-Şehîd Her zaman, her yerde hazır olan; her şeye şâhit olan; kendisine hiçbir şey gizli olmayan demektir. Allah Teâlâ, her şeyi bilendir. İlminden hiç bir şey gizli olmayandır. Allah, açıkta olanları da bilir, gizli olanları da bilir. O, her şeye şâhittir. Âhirette herkese halini bildirecektir.", "description_en": "Le T\\u00E9moin : Allah est l'ultime et parfait t\\u00E9moin de tout ce qui s'est pass\\u00E9 dans Son royaume, avec des preuves claires et flagrantes, parfaitement irr\\u00E9prochables.", "found": "(4:166)(22:17)(41:53)(48:28)"}, {"id": 51, "name_ar": "الْحَقُّ", "transcription_tr": "El-Hakk", "transcription_en": "Al Haqq", "meaning_tr": "Vacib\"ul vücut olan, varlığı hiç değişmeden duran.", "meaning_en": "The Truth", "description_tr": "El-Hakk Varlığı gerçek olan, varlığı hiç değişmeden duran; varlığı ve ilâhlığı kesin olan, hükmünün gereğini yerine getiren demektir. Allah Teâlâ, varlığı ve ilâhlığı kesin olan, inkârı mümkün olmayandır. O’nun zâtı yokluğu kabul etmediği gibi bir değişikliği de kabul etmez. Hükmünün gereğini yerine getirendir. Ezelî ve ebedî olandır. Değişmeksizin varlığı devam edendir. Varlığı fiilen gerçek olandır yani sadece zihinde değil, zihnin dışında da var olandır.", "description_en": "Is the One who holds the absolute Truth.", "found": "(6:62)(22:6)(23:116)(24:25)"}, {"id": 52, "name_ar": "الْوَكِيلُ", "transcription_tr": "El-Vekîl", "transcription_en": "Al Wakeel", "meaning_tr": "İşlerini kendisine bırakanların işini düzelten ve her şeyin iyisini temin eden.", "meaning_en": "The Trustee", "description_tr": "El-Vekîl İşlerini kendisine bırakanların işlerini en mükemmel bir şekilde yapan; kendisine güvenilip dayanılan demektir. Allah Teâlâ, her bakımdan insanın güvenip dayanacağı varlıktır. En güzel vekildir, en büyük vekildir. Yarattığı bütün varlıkların işlerini idare edendir. Allah Teâlâ, elinden geleni yaptıktan sonra işini Allah’a havale edeni, mükâfâtlandırır.", "description_en": "Is the One who guarantees the sustenance of creatures and the One from whom nothing of their every state can be concealed", "found": "(3:173)(4:171)(28:28)(73:9)"}, {"id": 53, "name_ar": "الْقَوِيُّ", "transcription_tr": "El-Kaviyy", "transcription_en": "Al Qawiyy", "meaning_tr": "Pek kuvvetli. Pek güçlü olan.", "meaning_en": "The Possessor of all strength", "description_tr": "El-Kaviyy Pek güçlü; gücü her şeye yeten demektir. Allah Teâlâ, tam bir kudret sahibidir. Gücü, kuvveti sonsuzdur; bitmez, tükenmez. Bir sınıra sığmaz, ölçüye gelmez. Nicelik ve nitelik bakımından üstün kudrete sahiptir. Gücünün yetmeyeceği bir şey düşünülemez. O, her şeyi etkiler, ama hiç bir şey O’nu etkileyemez.", "description_en": "The Mighty: Allah is the most powerful, the strongest, his strength has no limit and is not described with definitions of physical strength.", "found": "(22:40)(22:74)(42:19)(57:25)"}, {"id": 54, "name_ar": "الْمَتِينُ", "transcription_tr": "El-Metîn", "transcription_en": "Al Mateen", "meaning_tr": "Çok sağlam olan.", "meaning_en": "The Forceful", "description_tr": "El-Metîn Sonsuz kudrete sahip; son derece güçlü, kuvvetli; dayanıklı, sağlam demektir. Allah Teâlâ, sonsuz bir güce sahiptir. Fiillerinden dolayı zatına her hangi bir zorluk ve yorgunluk ilişmez. Kuvveti azalıp gevşemez. Hiçbir şey O’nu âciz bırakamaz. Hiç kimsenin yardımına da muhtaç değildir. Allah’ın “Kaviyy” ismi, kudretinin kemâlini ifâde eder. Bütün nesne ve olayları etkileyendir. “Metîn” ismi, kuvvetinin şiddetini bildirir. Dıştan gelebilecek hiç bir etkiyi kabul etmeyendir.", "description_en": "The Enduring: An endurance worthy of Him, unlimited, indefatigable, and which is not marred by any weakness, without pause, without interruption and which no factor can attenuate.", "found": "(51:58)"}, {"id": 55, "name_ar": "الْوَلِيُّ", "transcription_tr": "El-Veliyy", "transcription_en": "Al Waliyy", "meaning_tr": "İyi kullarına, gerçek mü'minlere dost olan.", "meaning_en": "The Protector", "description_tr": "El-Veliyy Dost ve yardımcı demektir. Allah Teâlâ, sevdiği kullarının dostudur. Onlara yardım eder; sıkıntılarını, darlıklarını giderir; ferahlık verir. Dünya ve âhiret işlerinde başarıya ulaştırır. Mü’minlerin yardımcısı ve koruyucusudur. Allah’tan başka gerçek dost ve yardımcı yoktur.", "description_en": "Is the One who preserves the believing servants, so the prophets and those who follow them are those who are the \"preserved people\" in the sense that they have been guided to the obligatory thanks to Him who makes them exist, that is, that is to say with regard to Allah", "found": "(4:45)(7:196)(42:28)(45:19)"}, {"id": 56, "name_ar": "الْحَمِيدُ", "transcription_tr": "El-Hamîd", "transcription_en": "Al Hameed", "meaning_tr": "Her türlü hamd ve övgüye layık olan.", "meaning_en": "The Praised", "description_tr": "El-Hamîd Övülmeye lâyık olan demektir. Allah Teâlâ, bütün isimleri, sıfatları ve fiilleriyle övülmeye tek lâyık olan zâttır. Bütün varlığın diliyle övülen ve şükredilendir. Allah Teâlâ, bizâtihî övülmeye lâyık olandır. Aynı zamanda insanların işledikleri iyi fiiller sebebiyle onları över ve mükâfâtlandırır.", "description_en": "Is the One who deserves the thanksgiving, the glorification and the song of praise more than any other", "found": "(14:8)(31:12)(31:26)(41:42)"}, {"id": 57, "name_ar": "الْمُحْصِي", "transcription_tr": "El-Muhsî", "transcription_en": "Al Muhsi", "meaning_tr": "İstisnasız her şeyin tek tek sayısını bilen.", "meaning_en": "The All-Enumerating, The Counter", "description_tr": "El-Muhsî Sonsuz ilmiyle her şeyin sayısını bilen, her yapılanı bir bir sayan demektir. Allah Teâlâ, sonsuz ilmi ile her şeyi kuşatmıştır. Her şeyi tek tek ve bütün ayrıntılarıyla bilendir. O’nun ilminden hiç bir şey hariç kalamaz. Bütün amellerin sayısını bilir, kıyâmet günü bunların hepsinin karşılığını verir. Hiç birini unutmaz ve atlamaz.", "description_en": "Literally translated as the counter but means the One who counts every creature, every act, every speck of dust in his kingdom and of whom nothing escapes his knowledge", "found": "(72:28)(78:29)(82:10-12)"}, {"id": 58, "name_ar": "الْمُبْدِئُ", "transcription_tr": "El-Mübdi", "transcription_en": "Al Mubdi", "meaning_tr": "Bütün mahlukatı maddesiz ve örneksiz olarak ilk baştan yaratan.", "meaning_en": "The Originator", "description_tr": "El-Mübdi Yaratıkları maddesiz ve örneksiz olarak ilk baştan yaratan demektir. Allah Teâlâ, kâinâtı yaratırken daha önce bir benzeri ve örneği olmaksızın yaratmıştır. İşte esas yaratma denilen, ilk maddesi, örneği olmaksızın yaratmadır. Bu, yoktan var etmedir ve Allah’a mahsustur.", "description_en": "Is the One who gives a beginning to what does not exist without a beginning, without a model, that is to say, the One who creates creatures", "found": "(10:34)(27:64)(29:19)(85:13)"}, {"id": 59, "name_ar": "الْمُعِيدُ", "transcription_tr": "El-Muid", "transcription_en": "Al Mu'eed", "meaning_tr": "Yaratılmışları yok ettikten sonra tekrar yaratan.", "meaning_en": "The Restorer", "description_tr": "El-Muid Yaratılmışları öldürdükten, yok ettikten sonra tekrar yaratan; öldükten sonra dirilten demektir. Allah Teâlâ, ilk defa yarattığı bütün insanları öldürecek, sonra tekrar diriltecek ve dünya hayatlarındaki inanç ve amellerinden hesaba çekecektir. Hayat, sadece dünya hayatından ibaret değildir. Tekrar bir hayat vardır ki gerçek ve devamlı hayat budur. İnsanlar buna göre hareket etmelidir.", "description_en": "Is the One who brings the living back to death after life and the One who brings the dead back to life after death", "found": "(10:34)(27:64)(29:19)(85:13)"}, {"id": 60, "name_ar": "الْمُحْيِي", "transcription_tr": "El-Muhyî", "transcription_en": "Al Muhiy", "meaning_tr": "İhya eden, dirilten, can bağışlayan, sağlık veren.", "meaning_en": "The Giver of life", "description_tr": "El-Muhyî Can veren, yaşatan demektir. Allah Teâlâ, can bağışlayan, sağlık verendir. Ölüleri diriltendir. Ölü beldeleri gökten indirdiği su ile canlandıran, yeryüzünü bitkilerle donatandır. İlk olarak yaratan, can veren Allah, öldükten sonra tekrar hayat vermeye kâdirdir. Ölü kalpleri ilâhî hidâyet ve marifetle canlandırandır.", "description_en": "Is the One who gives life to a mixture of maniyy, that is to say of seminal liquid, devoid of soul and makes him a living being and the One who gives life to the bodies of humans, jinns and angels by reuniting them with their souls during the resurrection", "found": "(7:158)(15:23)(30:50)(57:2)"}, {"id": 61, "name_ar": "اَلْمُمِيتُ", "transcription_tr": "El-Mümît", "transcription_en": "Al Mumeet", "meaning_tr": "Ölümü yaratan, öldüren.", "meaning_en": "The Taker of life", "description_tr": "El-Mümît Öldüren, canlının hayatına son veren demektir. Allah Teâlâ, canlılara hayat verdiği gibi, ezelî ilmindeki takdire göre vakti gelince bu hayatlara son verendir. Fânî hayat, doğumla başlar, ölümle biter. Hayat dediğimiz ruhla cesedin birleşmesidir. Ölüm ise ruhun cesedden ayrılmasıdır. Ruh, ölmez. Başka bir hayatla devam eder. Kul için, ölüm sonrası başlayacak yeni ve devamlı hayata iyi hazırlık yapmak mühimdir.", "description_en": "He is the One who kills living beings and the One who cancels out the power of the powerful of this world by death", "found": "(3:156)(7:158)(15:23)(57:2)"}, {"id": 62, "name_ar": "الْحَيُّ", "transcription_tr": "El-Hayy", "transcription_en": "Al Haiyy", "meaning_tr": "Diri, tam ve mükemmel manasıyla hayat sahibi.", "meaning_en": "The Ever Living", "description_tr": "El-Hayy Diri, canlı olan; ölmek şânından olmayan demektir. Allah Teâlâ, bütün hayatların kaynağıdır. Hep diridir. Allah’ın hayy (diri) oluşu, yaratılmış varlıklarda olduğu gibi organik bir canlılık değildir. Hiç bir şeyden gâfil olmayan, hata yapmayan, kâinâtta kendisinden hiç bir şey gizli olmayan demektir.", "description_en": "The Living One: Is the One who does not come into existence and yet exists, and the One who possesses a hayah and this attribute is not a life as is the hayah of creatures made up of a combination of soul, flesh and of blood Imam At-Tahawiyy said in his treatise on belief that \"he who attributes to Allah an attribute in a sense which is among those which can be attributed to human beings is disbeliever\"", "found": "(2:255)(3:2)(25:58)(40:65)"}, {"id": 63, "name_ar": "الْقَيُّومُ", "transcription_tr": "El-Kayyûm", "transcription_en": "Al Qayyoom", "meaning_tr": "Gökleri, yeri ve her şeyi tutan.", "meaning_en": "The Self Existing", "description_tr": "El-Kayyûm O, hiçbir varlığa muhtaç olmayan; varlığı ezelî ve ebedî olandır. Her şey ancak O’nun yaratmasıyla varlık bulur, O’nun kudretiyle ayakta kalır. Maddî ve mânevî bütün ihtiyaçları karşılayan, kâinatı düzen içinde tutan O’dur. Yeri ve gökleri ayakta tutan yalnızca Allah’tır.", "description_en": "Is the One who exists, is eternal and does not change and the One who is not affected by non-existence or annihilation and is in no way affected by controlling and creating the acts of human beings", "found": "(2:255)(3:2)(20:111)"}, {"id": 64, "name_ar": "الْوَاجِدُ", "transcription_tr": "El-Vâcid", "transcription_en": "Al Waajid", "meaning_tr": "İstediğini, istediği vakit bulan.", "meaning_en": "The Perceiver", "description_tr": "El-Vâcid İstediğini istediği zaman bulan; hiç bir şeye muhtaç olmayan demektir. Allah Teâlâ, dilediği şeye sahip olur. Bu hususta bir engelle karşılaşmaz. Bir şeyi ele geçirmek istediğinde zaman kollamaya, tedbir almaya, tuzak kurmaya ihtiyacı yoktur. İstediği, istediği zaman O’nun huzurundadır. Bütün yaratıklar O’nun emri ve tasarrufu altındadır.", "description_en": "Is the One who does not need anything and is not reached or concerned with want, lack or need", "found": "(38:44)"}, {"id": 65, "name_ar": "الْمَاجِدُ", "transcription_tr": "El-Mâcid", "transcription_en": "Al Maajid", "meaning_tr": "Kadri büyük, keremi bol olan.", "meaning_en": "The Glorious", "description_tr": "El-Mâcid Şânı ve kadri büyük; kerem ve cömertliği bol demektir. Allah Teâlâ, yardımı, ihsânı bol olandır. O’nun kullarına olan kerem ve cömertliği ifâdeye sığmaz, ölçüye gelmez. Bir taraftan kullarını iyi işler yapmaya muvaffak kılar; öbür taraftan onları güzel sıfatlara sahip olduklarından över.", "description_en": "Is the One who is better than any other and the One who bestows innumerable benefits very widely and without compensation", "found": "(11:73)"}, {"id": 66, "name_ar": "الْواحِدُ", "transcription_tr": "El-Vâhid", "transcription_en": "Al Waahid", "meaning_tr": "Tek olan.", "meaning_en": "The Only One", "description_tr": "El-Vâhid Bir olan, tek olan; zâtında, sıfatlarında, isimlerinde ve fiillerinde asla ortağı, dengi ve benzeri bulunmayan demektir. Allah Teâlâ, tektir, bölünüp parçalara ayrılmaz. Benzeri yoktur. Allah’ın bir olması sayı bakımından değildir, büyüklük ve yücelik açısındandır. O, bölünmesi ve artması mümkün olmayan tek bir varlıktır.", "description_en": "The Unique: Is the One who has no alter ego, whether in His Being, in His Act, or in His Attributes. Nothing is like him", "found": "(2:163)(5:73)(9:31)(18:110)"}, {"id": 67, "name_ar": "اَلاَحَدُ", "transcription_tr": "El-Ehad", "transcription_en": "Al Ahad", "meaning_tr": "Tek olan.", "meaning_en": "The One", "description_tr": "El-Vâhid Bir olan, tek olan; zâtında, sıfatlarında, isimlerinde ve fiillerinde asla ortağı, dengi ve benzeri bulunmayan demektir. Allah Teâlâ, tektir, bölünüp parçalara ayrılmaz. Benzeri yoktur. Allah’ın bir olması sayı bakımından değildir, büyüklük ve yücelik açısındandır. O, bölünmesi ve artması mümkün olmayan tek bir varlıktır.", "description_en": "The One: Is He Who has uniqueness as an attribute", "found": "(112:1)"}, {"id": 68, "name_ar": "الصَّمَدُ", "transcription_tr": "Es-Samed", "transcription_en": "As Samad", "meaning_tr": "Sığınacak tek dayanak olan.", "meaning_en": "The Supreme Provider", "description_tr": "Es-Samed Her şeyin kendisine muhtaç olduğu, kendisinin hiç bir şeye muhtaç olmadığı; ihtiyaçların giderilmesi ve ızdırapların dindirilmesi için başvurulacak tek merci demektir. Allah Teâlâ, yaratıkların her türlü ihtiyaçlarını gidermek için başvurdukları tek başvuru kaynağıdır. Her türlü yaratığın her türlü ihtiyacını en mükemmel bir şekilde karşılar ve giderir. Kendisi ise hiç bir şeye muhtaç değildir.", "description_en": "Is the One to whom we can rely for any business and who can be called upon for all our needs; One who has no children or parents, neither like nor equivalent, according to Al-Hakim's explanation; The One who needs nothing and the One who everything needs, in order to exist, etc.", "found": "(112:2)"}, {"id": 69, "name_ar": "الْقَادِرُ", "transcription_tr": "El-Kâdir", "transcription_en": "Al Qaadir", "meaning_tr": "Her şeye gücü yeten, her istediğini yapmaya kâdir olan.", "meaning_en": "The Powerful", "description_tr": "El-Kâdir Her şeye gücü yeten; kudret sahibi demektir. Allah Teâlâ, istediğini, istediği gibi yapmaya gücü yetendir. Her şeyi takdir eden, planlı ve ölçülü yapandır. Hiçbir şey O’nu âciz bırakamaz. Âlem, mutlak irâde ve kudrete sahip olan Allah tarafından yaratılmıştır.", "description_en": "Is the One who is unaffected by weakness, the One whose power is absolute and dominates all creatures and the One whom absolutely nothing can weaken", "found": "(6:65)(36:81)(46:33)(75:40)"}, {"id": 70, "name_ar": "الْمُقْتَدِرُ", "transcription_tr": "El-Muktedir", "transcription_en": "Al Muqtadir", "meaning_tr": "Kuvvet ve kudret sahipleri üzerinde dilediği gibi tasarruf eden.", "meaning_en": "The Creator of all power", "description_tr": "El-Muktedir Tam bir kudret sahibi; her şeye gücü yeten demektir. Allah Teâlâ, kuvvet ve kudret sahipleri üzerinde istediği gibi tasarruf edendir. O’nun “Kâdir” oluşu, istediğini, istediği anda ve istediği şekilde yaratma gücüne sahip olması demektir. “Muktedir” olması ise, bilfiil gücünü yarattıklarında göstermesidir.", "description_en": "Is the One who is mighty over all things and the One whose capacities are absolutely limitless", "found": "(18:45)(54:42)(54:55)"}, {"id": 71, "name_ar": "الْمُقَدِّمُ", "transcription_tr": "El-Mukaddim", "transcription_en": "Al Muqaddim", "meaning_tr": "İstediğini ileri geçirip, öne alan.", "meaning_en": "The Expediter", "description_tr": "İstediğini öne alan, ileri geçiren demektir. Allah Teâlâ, dilediği şeyi veya kimseyi öne alan, önde bulundurandır. Allah’ın daveti geneldir. Fakat hidâyet ettikleri davete uyar, ileri gider. Hidâyet etmedikleri geri kalır. Allah’ın emir ve yasakları bütün kullar içindir. Fakat Allah’ın muvaffak ettikleri bunlara uyar, yükselir; muvaffak etmedikleri geride kalır. O hâlde hem akıl ve irâdemizi Allah’a îmân ve itâat yönünde kullanmalı, hem de Allah’tan hidâyet istemelidir. “Mukaddim” ismi, “Muahhir” ismiyle beraber değerlendirilmelidir.", "description_en": "Is He who is free from the characteristics of creatures and better than any creature; He who fixes the speed of events, accelerates certain things in the eyes of people according to a destiny and grants each thing a value, a rank, a time and characteristics which suit Him according to wisdom", "found": "(16:61)(17:34)"}, {"id": 72, "name_ar": "الْمُؤَخِّرُ", "transcription_tr": "El-Muahhir", "transcription_en": "Al Mu’akhir", "meaning_tr": "İstediğini geri koyan, arkaya bırakan.", "meaning_en": "The Delayer", "description_tr": "El-Muahhir İstediğini geri koyan, arkaya bırakan demektir. Allah Teâlâ, hikmeti gereği geri bırakılması gerekenleri geri bırakır. “Mukaddim” ismi ile ilgili açıklamalarımız “Muahhir” ismi ile de ilgilidir. Esasen bu iki isim beraber değerlendirilmelidir. Bazan Allah Teâlâ, kulların istediklerini bir hikmeti gereği geri bırakır. İmtihan dünyasında olduğumuzu unutmamamız gerekir.", "description_en": "Is He who is free from the characteristics of creatures and better than any creature; The one who intends the slowness of events and slows down certain things in the eyes of people according to a destiny and grants each thing a value, a rank, a time and characteristics which suit it according to a wisdom (cf no 71)", "found": "(71:4)"}, {"id": 73, "name_ar": "الأوَّلُ", "transcription_tr": "El-Evvel", "transcription_en": "Al Awwal", "meaning_tr": "Başlangıcı olmayan, ilk olan.", "meaning_en": "The First", "description_tr": "El-Evvel İlk; varlığının başlangıcı olmayan demektir. Allah Teâlâ, bütün varlıklardan öncedir. Varlığının bir evveli, başlangıcı yoktur. O, kadîmdir, ezelîdir. Varlığı kendi zâtıyladır. Bütün varlıklar varlığını O’ndan almaktadır. Yaratmayı başlatan O’dur. “Evvel” ismini “Âhir” ismiyle beraber değerlendirmelidir.", "description_en": "The First: Is the One who exists without creatures, without beginning and without time; One who is exempt from being created, from the appearance of a new attribute and from change, One who exists without coming into existence", "found": "(57:3)"}, {"id": 74, "name_ar": "الآخِرُ", "transcription_tr": "El-Ã‚hir", "transcription_en": "Al Aakhir", "meaning_tr": "Sonu olmayan, sonsuz olan.", "meaning_en": "The Last", "description_tr": "El-Âhir Varlığının sonu olmayan demektir. Allah Teâlâ, varlığı devamlı olandır. Varlığının başlangıcı olmadığı gibi sonu da yoktur. Allah, eşyanın evveli olması bakımından “Evvel”dir. Eşyanın sonu Allah’tan olması bakımından da “Âhir”dir. “Âhir” ismini, “Evvel” ismiyle beraber değerlendirmelidir.", "description_en": "The Last: Is the One who exists without interruption while the creatures are annihilated at every moment; He who is eternal, He who annihilates and is exempt from being annihilated and the disappearance of one or more attributes; The one that exists without being concerned by the notion of end and annihilation", "found": "(57:3)"}, {"id": 75, "name_ar": "الظَّاهِرُ", "transcription_tr": "Ez-Zâhir", "transcription_en": "Az Zaahir", "meaning_tr": "Açıkca bilinen, âşikâr olan.", "meaning_en": "The Manifest", "description_tr": "Ez-Zâhir Varlığı apaçık demektir. Allah Teâlâ, varlığını ve birliğini belgeleyen birçok delil bulunması açısından aşikârdır. Her şeyin üstünde olan, her şeyden yüce olandır. Allah’ın varlığı o kadar açıktır ki insanın gördüğü her şey, ibret nazarıyla baktığı takdirde onu, Allah’a götürür. “Zâhir” ismi, “Bâtın” ismiyle beraber değerlendirilmelidir.", "description_en": "Is the One whose existence is manifested in everything by proofs, from the point of view of power and domination and not what would be present in any body from the point of view of place, image and how", "found": "(57:3)"}, {"id": 76, "name_ar": "الْبَاطِنُ", "transcription_tr": "El-Bâtın", "transcription_en": "Al Baatin", "meaning_tr": "Gizli olan.", "meaning_en": "The Hidden", "description_tr": "El-Bâtın Zâtının görülmesi ve mâhiyetinin bilinmesi açısından gizli demektir. Allah Teâlâ, gizlidir. Çünkü O, gözle görülemez, künhüyle bilinemez. İnsan, her şeyiyle sınırlıdır. Allah ise, sınırsızdır. Sınırlı olan sınırsız olanı idrâk ve ihâta edemez. “Bâtın” ismi, “Zâhir” ismiyle beraber değerlendirilmelidir.", "description_en": "Is the One who is preserved from the delusions of creatures attempting to attribute to the Creator human characteristics or characteristics of creatures and the One who creates the characteristics of creatures and their images", "found": "(57:3)"}, {"id": 77, "name_ar": "الْوَالِي", "transcription_tr": "El-Vâlî", "transcription_en": "Al Waali", "meaning_tr": "Her şeyi tek başına idare eden.", "meaning_en": "The Governor", "description_tr": "El-Vâlî Kâinatın tek hâkimi, yöneticisi demektir. Allah Teâlâ, bu büyük evreni ve her an meydana gelen bütün olayları tek başına yönetendir. Yaratıkların işlerini yerine koyandır. Bütün varlıkların tek hükümdârı olup onlar üzerinde istediği şekilde tasarrufta bulunandır. Dirilten ve öldüren O’dur. Hiç bir şey O’nun tasarrufunun dışında kalmaz.", "description_en": "Is the One who owns, manages and controls all things and the One who creates everything according to wisdom", "found": "(13:11)(22:7)"}, {"id": 78, "name_ar": "الْمُتَعَالِي", "transcription_tr": "El-Müteâlî", "transcription_en": "Al Muta’ali", "meaning_tr": "Aklın mümkün gördüğü her şeyden, her hâl ve tavırdan münezzeh olan.", "meaning_en": "The Supreme One", "description_tr": "El-Müteâlî İzzet, şeref ve hükümranlık bakımından en yüce demektir. Allah Teâlâ, yaratılmışlar hakkında aklın mümkün gördüğü her şeyden, her hal ve tavırdan yücedir. Zât, sıfat ve fiilleri açısından yaratılmışlara benzemekten, denk ve ortağı bulunmaktan yücedir.", "description_en": "Is the One who is free from the attributes of creatures and the One whose power over creatures is boundless", "found": "(13:9)"}, {"id": 79, "name_ar": "الْبَرُّ", "transcription_tr": "El-Berr", "transcription_en": "Al Barr", "meaning_tr": "Kullarına iyilik ve ihsanı, nimetleri bol olan.", "meaning_en": "The Doer of Good", "description_tr": "El-Berr İyilik ve bahşişi çok olan; va’dini yerine getiren demektir. Allah Teâlâ, kulları hakkında kolaylık isteyendir. Yaratıklarına karşı rahmet ve mağfireti; lütuf ve ihsânı bol olandır. Kullarının hep iyiliğini ister, kötülüklerini ve zorluk çekmelerini istemez. Yapılan kötülüklerin çoğunu bağışlar, örtbas eder.", "description_en": "Is the One who has the ability to bestow faith and blessings on all creatures, and among them some are grateful and some are not: the former are called Muslims or believers and others are called non-Muslims or non-Muslims. -believers", "found": "(52:28)"}, {"id": 80, "name_ar": "التَّوَابُ", "transcription_tr": "Et-Tevvâb", "transcription_en": "At Tawwaab", "meaning_tr": "Tövbeleri kabul eden.", "meaning_en": "The Guide to Repentence", "description_tr": "Et-Tevvâb Tövbe eden kullarının tövbelerini kabul eden ve tövbede muvaffak kılan demektir. Allah Teâlâ, kullarını tövbeye sevkeden ve tövbelerini kabul edendir. Kendisine yönelen kullarının günahlarını affedendir. Tövbeleri kabul edip günahları bağışlayandır. Kul, işlediği günahlardan pişman olur, tövbeye yönelirse Allah onu tövbesinde başarılı kılar ve tövbesini kabul eder.", "description_en": "Is the One who grants forgiveness to those who repent every time they repent", "found": "(2:128)(4:64)(49:12)(110:3)"}, {"id": 81, "name_ar": "الْمُنْتَقِمُ", "transcription_tr": "El-Müntakim", "transcription_en": "Al Muntaqim", "meaning_tr": "Suçluları adaletiyle cezalandırıp intikam alan.", "meaning_en": "The Avenger", "description_tr": "El-Müntakim Suçlulara, adâleti ile hak ettikleri cezayı veren demektir. Allah Teâlâ, suçluları hemen cezalandırmaz. Onları çeşitli yollarla uyarır. Yanlış davranışından dönmesi için kendisine fırsat ve yeterli zaman verir. Tövbe etmeyenleri cezalandırır. Fakat bu cezalandırma kendisi için değildir; zulüm ve gadre uğrayanlar içindir. Allah, dostlarından değil, düşmanlarından intikam alır.", "description_en": "Is the avenger", "found": "(32:22)(43:41)(44:16)"}, {"id": 82, "name_ar": "العَفُوُّ", "transcription_tr": "El-Afüvv", "transcription_en": "Al Afuww", "meaning_tr": "Affı ve rahmeti çok olan, bağışlayan.", "meaning_en": "The Forgiver", "description_tr": "El-Afüvv Hiç bir sorumluluk kalmayacak şekilde günahları affeden demektir. Allah Teâlâ, günahları kökünden kazıyıp tamamen yok eder. Kirâmen kâtibin meleklerinin kayıtlarını siler. Hatırlayıp mahçup olmasınlar diye kullarına işledikleri günahları da unutturur. Bu isimden nasip alan kul, bir taraftan devamlı Allah’tan af diler, diğer taraftan ümitsizliğe kapılmaz. Kullara karşı da çok affedici olur.", "description_en": "Is the One who sets aside and forgives sin and the One who preserves in every seemingly hopeless situation a door to honor, maintenance and blessings or to immediate repentance", "found": "(4:99)(4:149)(22:60) "}, {"id": 83, "name_ar": "الرَّؤُوفُ", "transcription_tr": "Er-Raûf", "transcription_en": "Ar Ra’oof", "meaning_tr": "Pek acıyan, lütuf ve merhametle pek esirgeyen.", "meaning_en": "The Most Kind", "description_tr": "Er-Raûf Çok şefkatli ve merhametli demektir. Allah Teâlâ, kullarına karşı ileri derecede merhamet ve şefkat sahibidir. Kullarının sıkıntılarını ortadan kaldırır. Allah kullarına akıl ve iyiyi kötüyü ayırt etme yeteneği vermiştir. Kullarını, işledikleri suçlardan dolayı hemen cezalandırmaz. Onlara hatalarından dönmesi için fırsat tanır. İnanan kullarının kusurlarını bağışlar, iyi amellerine fazlasıyla mükâfât verir.", "description_en": "Is the One who can offer an immensity of benefits without counterpart and without necessity", "found": "(3:30)(9:117)(57:9)(59:10)"}, {"id": 84, "name_ar": "مَالِكُ الْمُلْكِ", "transcription_tr": "Mâlikü'l-Mülk", "transcription_en": "Maalik Ul Mulk", "meaning_tr": "Mülkün ebedi sahibi olan.", "meaning_en": "The Owner / Soverign of All", "description_tr": "Mâlikü’l-Mülk Mülkün gerçek sâhibi; bütün varlık âleminin tek hâkimi demektir. Allah Teâlâ, bütün kâinatın tek sâhibi ve mâlikidir. Mülkünde istediği gibi tasarruf eder. Dilediğine mülk verir, dilediğine vermez. Dilediğine az verir, dilediğine çok verir. Mutlak hükümranlık O’na aittir. Bu isimden nasip alan kulda mal ve mülkün emânet olduğu şuuru yerleşir. Mal ve mülkü nasıl kullanacağını bilir; israf ve cimrilikten uzak durur. Nimet verene şükrünü tam yapar.", "description_en": "Is the One who creates and attributes according to a destiny all sovereignty, domination, property and all broad power which are granted to certain creatures in this lower world", "found": "(3:26)"}, {"id": 85, "name_ar": "ذُوالْجَلاَلِ وَالإكْرَامِ", "transcription_tr": "Zü'l- Celal-i ve'l-İkram", "transcription_en": "Dhu Al Jalaali Wa Al Ikraam", "meaning_tr": "Her türlü büyüklüğün, her türlü keremin sahibi olan.", "meaning_en": "Possessor of Majesty and Bounty", "description_tr": "Zü’l- Celal-i ve’l-İkram Ululuk ve ikrâm sahibi demektir. Allah Teâlâ, yaratıkları tarafından yüceltilmeye ve övülmeye lâyık olandır. Kullarından dilediklerine, kendisine samimiyetle kulluk vazifelerini yapmayı sağlayan, mânevî derecelerini yükselten, dünyada ve âhirette onlara bol lütuflarda bulunandır. Ne kadar büyüklük, ululuk, yücelik varsa, hepsi Allah’a mahsustur.", "description_en": "That is, Allah is the One who is better than any other in reality and all the evidence confirms this and denies the contrary so it is not valid to dispute this point, to deny it or to be hostile against this subject; is the One who fills with blessings those who will have understood this who will know the general holiness, will have success and will be well guided on the Day of Judgment", "found": "(55:27)(55:78)"}, {"id": 86, "name_ar": "الْمُقْسِطُ", "transcription_tr": "El-Muksıt", "transcription_en": "Al Muqsit", "meaning_tr": "Bütün işleri birbirine uygun ve denk yapan.", "meaning_en": "The Equitable One", "description_tr": "El-Muksıt Adâlet sahibi; bütün işlerini denk, birbirine uygun ve yerli yerinde yapan demektir. Allah Teâlâ, adâletle hükmedendir. En üstün adâlet ve merhamet sahibidir. Mazlumların haklarını zâlimlerden alandır. Dünyada dost düşman ayırımı yapmadan bütün kullarına rızık verir. Âhirette, dostları, yaptıklarının karşılığını fazlasıyla alacak, düşmanları ise sadece yaptıklarının karşılığı bir cezaya çarptırılacaklardır.", "description_en": "Is the One who judges according to the greatest justice, the One who is free from all forms of injustice and tyranny, and the One who has absolutely no accountability", "found": "(7:29)(3:18)"}, {"id": 87, "name_ar": "الْجَامِعُ", "transcription_tr": "El-Câmî", "transcription_en": "Al Jaami'", "meaning_tr": "İstediğini istediği zaman istediği yerde toplayan.", "meaning_en": "The Gatherer", "description_tr": "El-Câmî İstediğini istediği zaman istediği yerde toplayan demektir. Allah Teâlâ, birbirine benzeyen şeyleri ve benzemeyen zıt şeyleri bir araya getirip toplayandır. Kıyâmet günü hesaba çekmek için yaratıkları toplayandır. Bütün iyilikleri, güzellikleri ve övgüleri zâtında toplayandır. Tabiatları zıt birçok unsuru bir araya getirendir. İnsanları birbirlerine sevdirip kalpleri ısındırandır.", "description_en": "Is the One who gathers creatures together on a day of which there is no doubt, the Day of Judgment", "found": "(3:9)"}, {"id": 88, "name_ar": "الْغَنِيُّ", "transcription_tr": "El-Ganîyy", "transcription_en": "Al Ghaniyy", "meaning_tr": "Çok zengin olan.", "meaning_en": "The Rich One", "description_tr": "El-Ganîyy Çok zengin olan; hiç bir şeye muhtaç olmayan demektir. Allah Teâlâ, her şey kendisine muhtaç olan; kendisi hiç bir şeye muhtaç olmayandır. Zât ve sıfatlarında her türlü ihtiyaçtan uzak olandır. Çok zengindir, hiçbir şeye ihtiyacı yoktur. Ama bütün varlıklar her konuda O’na muhtaçtır.", "description_en": "Is the One who has no need of creatures and whose creatures cannot do without al-Ghaniyy [who is the One who makes them exist and keeps them in existence and constantly changes them]", "found": "(3:97)(39:7)(47:38)(57:24)"}, {"id": 89, "name_ar": "الْمُغْنِي", "transcription_tr": "El-Muğnî", "transcription_en": "Al Mughi", "meaning_tr": "İstediğini zengin eden.", "meaning_en": "The Enricher", "description_tr": "El-Muğnî İstediğini zengin eden demektir. Allah Teâlâ, dilediği kulun her türlü ihtiyacını karşılayandır. Fakir kullarını lütuf ve ihsânıyla zenginleştirir. Kanâat duygusu lütfedip gönül zenginliğine eriştirir. Kulun hal ve davranışlarını rızası yönüne yönlendirerek mânevî bakımdan zenginleştirir.", "description_en": "Is the One who satisfies the needs of creatures and the One who brings them their sustenance", "found": "(9:28)"}, {"id": 90, "name_ar": "اَلْمَانِعُ", "transcription_tr": "El-Mânî", "transcription_en": "Al Maani'", "meaning_tr": "Bazı şeylerin meydana gelmesine müsaade etmeyen, engelleyen.", "meaning_en": "The Preventer of harm", "description_tr": "El-Mânî Dilemediği şeylerin gerçekleşmesine izin vermeyen; kötü şeylere engel olan demektir. Allah Teâlâ, bazı isteklerin gerçekleşmesine müsaade etmez. Bütün isteklerimiz, Allah’ın dilemesi ve takdiriyle gerçekleşir. O’nun dilemediği bir şey olmaz. Dilediği şey de olur. Allah Teâlâ, sevdiği kullarının bazı kötü isteklerine engel olmak suretiyle onları zarardan korur.", "description_en": "Is the One who intends for each creature his victories, his protections and the One from whom they must always be preserved according to a destiny", "found": "(67:21)"}, {"id": 91, "name_ar": "الضَّارَّ", "transcription_tr": "Ed-Dâr", "transcription_en": "Ad Daaarr", "meaning_tr": "Elem ve zarar verecek şeyleri yaratan, hüsrana ugratan.", "meaning_en": "The Creator of the harmful", "description_tr": "Ed-Dâr Zarar veren; elem ve zarar verici şeyleri yaratan demektir. Allah Teâlâ, bir kuluna her hangi bir zarar vermeyi dilerse, hiç kimse ona fayda veremez. Fayda vermek istediği kimseye de kimse zarar veremez. “Dârr” ismi, “Nâfi’” ismiyle beraber değerlendirilmelidir.", "description_en": "Is the One who is almighty to bring inevitably the nuisance which must reach a creature according to a destiny", "found": "(6:17)"}, {"id": 92, "name_ar": "النَّافِعُ", "transcription_tr": "En-Nâfi", "transcription_en": "An Naafi’", "meaning_tr": "Hayır ve menfaat verecek şeyleri yaratan.", "meaning_en": "The Bestower of Benefits", "description_tr": "En-Nâfi Fayda veren; dilediği kuluna hayırlı ve faydalı olanı veren demektir. Allah Teâlâ, zararlı gibi görünen her şeyi sezilmez yollarla faydalı hale getirendir. Çaresizlerin imdad
