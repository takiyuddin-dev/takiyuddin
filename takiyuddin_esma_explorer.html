ına yetişendir. Kulunu hayra ve iyiliğe yöneltendir. “Nâfi” ismi, “Dârr” ismiyle beraber değerlendirilmelidir.", "description_en": "Is the One who is almighty to bring inevitably the profit that a creature must receive according to a destiny", "found": "(30:37)"}, {"id": 93, "name_ar": "النُّورُ", "transcription_tr": "En-Nûr", "transcription_en": "An Noor", "meaning_tr": "Alemleri nurlandıran.", "meaning_en": "The Light", "description_tr": "En-Nûr Nurlandıran, ışık veren, nur kaynağı; âlemleri nurlandıran; istediği simalara, zihinlere ve gönüllere nur yağdıran demektir. Allah Teâlâ, varlığı apaçık olandır. Nuru yaratan, onunla gökleri ve yeri aydınlatandır. Kulunun kalbini, gönlünü îmân nuruyla aydınlatarak hidâyete ermesini ve doğruyu bulmasını sağlayandır.", "description_en": "The Light: Is the One who guides to their goal those who are prey to temptation and puts them in the right direction according to a destiny; Allah is the One who guides believers to the light of faith, creates light and is not a light that is only a creature", "found": "(24:35)"}, {"id": 94, "name_ar": "الْهَادِي", "transcription_tr": "El-Hâdî", "transcription_en": "Al Haadi", "meaning_tr": "Hidayete ve doğru yola erdiren.", "meaning_en": "The Guider", "description_tr": "El-Hâdî Hidâyeti yaratan; istediği kulunu muradına erdiren, hayırlı yollara muvaffak kılan demektir. Allah Teâlâ, inanacak kalplerde hidâyeti yaratandır. Ebedî mutluluğu sağlayacak doğru yolu gösteren ve doğru yola ulaştırandır. Yolunu şaşırmışlara rehberlik edendir.", "description_en": "Is the One who intends for certain creatures the benefit of being well guided and of knowing righteousness", "found": "(25:31)"}, {"id": 95, "name_ar": "الْبَدِيعُ", "transcription_tr": "El-Bedî", "transcription_en": "Al Badi'", "meaning_tr": "Örneksiz, misilsiz, hayret verici nice âlemler icad eden.", "meaning_en": "The Incomparable Originator", "description_tr": "El-Bedî Varlıkları, eşi, benzeri ve örneği olmaksızın, sanatkârane bir şekilde yaratan demektir. Allah Teâlâ, her şeyi, bir numûnesi, benzeri olmaksızın yaratandır. Bu yaratma da eşsiz ve benzersiz bir yaratmadır. Yani akıllara durgunluk verecek derecede kusursuz ve mükemmel yaratmadır. Allah, zâtında, sıfatlarında ve fiillerinde benzeri görülmeyendir.", "description_en": "Is the One who brings creatures and this world into existence, not from pre-existing matter or in the image of an earlier model, but on the contrary without precursor, model and unprecedented", "found": "(2:117)(6:101)"}, {"id": 96, "name_ar": "اَلْبَاقِي", "transcription_tr": "El-Bâki", "transcription_en": "Al Baaqi", "meaning_tr": "Varlığının sonu bulunmayan, ebedi olan.", "meaning_en": "The Everlasting One", "description_tr": "El-Bâki Ebedî olan; varlığının sonu olmayan demektir. Allah Teâlâ, varlığı devamlı olandır. Varlığının bir başlangıcı olmadığı gibi bir sonu da yoktur. Zâtı da, sıfatları da, fiilleri de bâkîdir, ebedîdir, devamlıdır. Mü’min de her hangi bir işi Allah rızası için yapmışsa, o fiil de ebedîlik kazanır. Yani kul, öbür âlemde mükâfâtını alır.", "description_en": "Is the One whose existence free from annihilation and change is imposed on sound reason which cannot claim the contrary", "found": "(55:27)"}, {"id": 97, "name_ar": "الْوَارِثُ", "transcription_tr": "El-Vâris", "transcription_en": "Al Waarith", "meaning_tr": "Servetlerin gerçek sahibi olan.", "meaning_en": "The Inhertior", "description_tr": "El-Vâris Varlığının sonu olmayan demektir. Allah Teâlâ, yaratılmış bütün varlıkları yok ettikten sonra bâkî kalan, mülkün gerçek sahibidir. Mülkü dilediğinden alır, dilediğine verir. Dünyada bulunan herkes ve evrende bulunan her şey fânîdir, geçicidir. İnsanlar ölümlü oldukları için sahip oldukları mal, mülk, servet de geçicidir.", "description_en": "Is the One who exists and does not change as creatures are wiped out", "found": "(15:23)"}, {"id": 98, "name_ar": "الرَّشِيدُ", "transcription_tr": "Er-Reşid", "transcription_en": "Ar Rasheed", "meaning_tr": "Bütün işleri ezeli takdirine uygun bir nizam ve hikmet üzere sonuna ulaştıran.", "meaning_en": "The Most Righteous Guide", "description_tr": "Er-Reşid İrşad eden; doğru yolu gösteren demektir. Allah Teâlâ, bütün işleri isabetli olan ve hedefine ulaşandır. Her şeyi ezelî takdirine göre yürüten, bir nizam ve hikmet üzere sonuna ulaştırandır. Lüzumsuz, faydasız, boş iş yapmayandır. Fiilleri dâimâ yerinde olandır. Devamlı olarak hakka isabet edendir. Hiç kimsenin yol göstermesine muhtaç olmayandır.", "description_en": "Is the One who guides creatures to what is in their best interests", "found": "(2:256)"}, {"id": 99, "name_ar": "الصَّبُورُ", "transcription_tr": "Es-Sabûr", "transcription_en": "As Saboor", "meaning_tr": "Çok sabırlı olan.", "meaning_en": "The Patient One", "description_tr": "Es-Sabûr Çok sabırlı demektir. Allah Teâlâ, günahkârları cezalandırma konusunda acele etmeyip lütfuyla bağışlayan ve erteleyendir. Günahkârlara mühlet tanır. Tövbe kapısını ölünceye kadar açık tutar. Kullarının af ve bağışlama dilemeleri için onlara fırsatlar tanır. Bu isimden nasip alan kul, ibâdetleri yapmada, haramlardan kaçınmada ve her türlü felâket karşısında sabırlı olur.", "description_en": "Is the One who delays the punishment of sinners by adjusting the accounts of each until a definite day and gives them their ease and time until a time of which they all do not know the date.", "found": "(2:153)(3:200)(103:3)"}];
    const namesGrid = document.getElementById('namesGrid');
    const searchInput = document.getElementById('search');
    const stats = document.getElementById('stats');

    function renderNames(filter = '') {
        namesGrid.innerHTML = '';
        let count = 0;
        const normFilter = filter.toLowerCase().trim();

        esmaData.forEach(item => {
            const arMatch = item.name_ar.includes(filter);
            const trMatch = (item.transcription_tr || '').toLowerCase().includes(normFilter);
            const enMatch = (item.transcription_en || '').toLowerCase().includes(normFilter);
            const mtrMatch = (item.meaning_tr || '').toLowerCase().includes(normFilter);
            const menMatch = (item.meaning_en || '').toLowerCase().includes(normFilter);
            const dtrMatch = (item.description_tr || '').toLowerCase().includes(normFilter);
            
            if (arMatch || trMatch || enMatch || mtrMatch || menMatch || dtrMatch) {
                count++;
                const card = document.createElement('div');
                card.className = 'name-card';
                card.innerHTML = `
                    <div class="name-id">#${String(item.id).padStart(2, '0')}</div>
                    <div class="arabic">${item.name_ar}</div>
                    <div class="transcription">${item.transcription_tr}</div>
                    <div class="meaning">${item.meaning_tr}</div>
                    <div class="details">
                        ${item.description_tr}
                        ${item.found ? `<div class="found">${item.found}</div>` : ''}
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    card.classList.toggle('active');
                });
                
                namesGrid.appendChild(card);
            }
        });

        stats.textContent = `99 İSİMDEN ${count} TANESİ`;
        if (count === 0) {
            namesGrid.innerHTML = '<div class="empty-state">Eşleşen sonuç bulunamadı.</div>';
        }
    }

    searchInput.addEventListener('input', (e) => {
        renderNames(e.target.value);
    });

    // Initial render
    renderNames();
</script>
